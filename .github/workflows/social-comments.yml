name: Social comments (Threads·Instagram·Facebook 댓글)

# 유튜브 댓글 자동 답글과 같은 요령으로 SNS 댓글·대댓글을 모니터링한다(운영자 지시 2026-10-15).
#  - 수동 실행 mode=list : 답할 차례인 댓글을 모아 작업 로그의 "OPEN_JSON:" 한 줄로 낸다(세션이 읽어 답글을 쓴다).
#  - 수동 실행 mode=probe: 채널마다 댓글 읽기 권한을 확인한다.
#  - 수동 실행 mode=profile: 채널마다 프로필(바이오) 읽기 결과를 "PROFILE_JSON:" 한 줄로 낸다(운영자 지시 2026-10-27).
#  - 수동 실행 mode=insights: 인스타그램·Threads 게시물 성과를 "INSIGHTS_JSON:" 한 줄로 낸다(운영자 지시 2026-10-16).
#  - social/replies/*.json 이 올라오면 답글을 게시하고 결과를 social/replies/done/ 에 커밋한다.
# 필요한 GitHub 비밀값: THREADS_ACCESS_TOKEN, IG_ACCESS_TOKEN, FB_PAGE_ID, FB_PAGE_TOKEN
on:
  push:
    branches: [main]
    paths: ["social/replies/*.json"]
  schedule:
    - cron: "12 * * * *"   # 매시 12분: 답할 차례인 SNS 댓글을 social/open/latest.json 으로 커밋(세션은 이 파일만 읽어 토큰 절약, 2026-11-10)
  workflow_dispatch:
    inputs:
      mode:
        description: "list(기본) / probe / inspect(days 칸에 Threads 글 ID — 답글 상태 확인) / insights(인스타·Threads 게시물 성과) / profile(프로필 바이오 읽기) / profile_set(페이스북 소개 고치기)"
        required: false
        default: "list"
      days:
        description: "며칠 안의 댓글을 볼지"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: social-comments
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      MODE: ${{ github.event_name == 'push' && 'post' || github.event.inputs.mode }}
      DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_comments.py > /dev/null
      - name: Run
        run: |
          case "$MODE" in
            post) python scripts/social_comments.py --post ;;
            probe) python scripts/social_comments.py --probe ;;
            inspect) python scripts/social_comments.py --inspect "$DAYS" ;;  # days 칸에 Threads 글 ID(쉼표로 여럿)
            insights) python scripts/social_insights.py --log --days "$DAYS" ;;
            profile) python scripts/social_profile.py ;;
            profile_set) python scripts/social_profile.py --set social/profile/set.json ;;
            *) python scripts/social_comments.py --list --days "$DAYS" --log | tee /tmp/list.txt ;;
          esac
      - name: Commit results
        # 일부 답글이 실패해도 이미 단 결과는 반드시 커밋한다(중복 답글 방지)
        if: always() && env.MODE == 'post'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A social/replies
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -q -m "SNS 댓글 답글 기록 $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::답글 기록 커밋을 올리지 못함"; exit 1
      - name: Save open list
        # 정기 실행·수동 list 실행이면 OPEN_JSON 을 파일로 남긴다. 세션은 워크플로 실행·로그 대기 없이 이 파일만 읽는다
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (env.MODE == 'list' || env.MODE == ''))
        run: |
          mkdir -p social/open
          line=$(grep -h "OPEN_JSON:" /tmp/list.txt | tail -1 | sed 's/^.*OPEN_JSON: *//')
          [ -n "$line" ] || { echo "OPEN_JSON 없음"; exit 0; }
          python -c "import json,sys,datetime;d=json.loads(sys.argv[1]);d['saved_utc']=datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%MZ');json.dump(d,open('social/open/latest.json','w'),ensure_ascii=False,indent=1)" "$line"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social/open/latest.json
          if git diff --cached --quiet; then echo "바뀐 목록 없음"; exit 0; fi
          git commit -q -m "SNS 답할 댓글 목록 $(TZ=America/New_York date '+%m-%d %H:%M') ET"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done

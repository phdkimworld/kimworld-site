name: Social comments (Threads·Instagram·Facebook 댓글)

# 유튜브 댓글 자동 답글과 같은 요령으로 SNS 댓글·대댓글을 모니터링한다(운영자 지시 2026-10-15).
#  - 수동 실행 mode=list : 답할 차례인 댓글을 모아 작업 로그의 "OPEN_JSON:" 한 줄로 낸다(세션이 읽어 답글을 쓴다).
#  - 수동 실행 mode=probe: 채널마다 댓글 읽기 권한을 확인한다.
#  - social/replies/*.json 이 올라오면 답글을 게시하고 결과를 social/replies/done/ 에 커밋한다.
# 필요한 GitHub 비밀값: THREADS_ACCESS_TOKEN, IG_ACCESS_TOKEN, FB_PAGE_ID, FB_PAGE_TOKEN
on:
  push:
    branches: [main]
    paths: ["social/replies/*.json"]
  workflow_dispatch:
    inputs:
      mode:
        description: "list(기본) / probe"
        required: false
        default: "list"
      days:
        description: "며칠 안의 댓글을 볼지"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: social-comments
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      MODE: ${{ github.event_name == 'push' && 'post' || github.event.inputs.mode }}
      DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_comments.py > /dev/null
      - name: Run
        run: |
          case "$MODE" in
            post) python scripts/social_comments.py --post ;;
            probe) python scripts/social_comments.py --probe ;;
            *) python scripts/social_comments.py --list --days "$DAYS" --log ;;
          esac
      - name: Commit results
        # 일부 답글이 실패해도 이미 단 결과는 반드시 커밋한다(중복 답글 방지)
        if: always() && env.MODE == 'post'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A social/replies
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -q -m "SNS 댓글 답글 기록 $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::답글 기록 커밋을 올리지 못함"; exit 1

name: API (views, comments)

# worker/ 가 바뀌거나 손으로 실행하면 Cloudflare에 API를 배포한다.
# 필요한 GitHub 비밀값: CLOUDFLARE_API_TOKEN(권한: Account Workers Scripts Edit, Account D1 Edit), CLOUDFLARE_ACCOUNT_ID (없으면 배포를 건너뛴다)
# 선택: KIMWORLD_ADMIN_TOKEN (관리 화면 비밀번호. 없으면 API 토큰에서 만든 값을 쓴다)
# 로그인(있는 것만 켜짐): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET / KAKAO_REST_KEY, KAKAO_CLIENT_SECRET(카카오에서 켠 경우만) / NAVER_CLIENT_ID, NAVER_CLIENT_SECRET
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/api.yml"]
  # 로그인 비밀값을 GitHub에 넣은 뒤에는 Actions 화면에서 이 워크플로를 손으로 한 번 실행하면 적용된다
  workflow_dispatch:
    inputs:
      comment_id:
        description: "관리: 상태를 바꿀 댓글 번호(비우면 배포만)"
        required: false
      status:
        description: "관리: ok(다시 게시) / hidden(숨김) / deleted(삭제)"
        required: false
        default: "deleted"

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_IN: ${{ secrets.KIMWORLD_ADMIN_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_LIVE: ${{ vars.NAVER_LIVE }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test
        run: node test/test_worker.mjs
      - name: Check secrets
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare 비밀값이 없어 배포를 건너뜁니다."; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare D1 database
        if: steps.chk.outputs.go == 'yes'
        run: |
          W="npx --yes wrangler@3.99.0"
          ID=$($W d1 list --json | jq -r '.[] | select(.name=="kimworld") | .uuid' | head -1)
          if [ -z "$ID" ]; then
            $W d1 create kimworld
            ID=$($W d1 list --json | jq -r '.[] | select(.name=="kimworld") | .uuid' | head -1)
          fi
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          $W d1 migrations apply kimworld --remote
      - name: Deploy worker
        if: steps.chk.outputs.go == 'yes'
        run: |
          W="npx --yes wrangler@3.99.0"
          $W deploy
          SALT=$(printf '%s' "$CLOUDFLARE_API_TOKEN:salt" | sha256sum | cut -c1-48)
          ADMIN=${ADMIN_IN:-$(printf '%s' "$CLOUDFLARE_API_TOKEN:admin" | sha256sum | cut -c1-40)}
          printf '%s' "$SALT" | $W secret put SALT
          printf '%s' "$ADMIN" | $W secret put ADMIN_TOKEN
          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET KAKAO_REST_KEY KAKAO_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET NAVER_LIVE; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | $W secret put "$k" >/dev/null && echo "::notice::$k 설정함"; else echo "::notice::$k 없음"; fi
          done
          true
      - name: Health check
        if: steps.chk.outputs.go == 'yes'
        continue-on-error: true   # api.drkimworld.com 연결 전에는 실패해도 배포는 성공으로 둔다
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api.drkimworld.com/v1/health || true)
            echo "health: HTTP $code"
            if [ "$code" = "200" ]; then echo "::notice::로그인 제공자: $(curl -s https://api.drkimworld.com/v1/me | jq -c .providers)"; exit 0; fi
            sleep 20
          done
          echo "api.drkimworld.com 응답 없음(도메인 연결이 몇 분 걸릴 수 있음)"; exit 1
      - name: Moderate comment
        if: steps.chk.outputs.go == 'yes' && github.event.inputs.comment_id != ''
        env:
          CID: ${{ github.event.inputs.comment_id }}
          ST: ${{ github.event.inputs.status }}
        run: |
          [[ "$CID" =~ ^[0-9]+$ ]] || { echo "댓글 번호는 숫자"; exit 1; }
          [[ "$ST" =~ ^(ok|hidden|deleted|held)$ ]] || { echo "상태 값 오류"; exit 1; }
          # 웹 주소 대신 Cloudflare 도구로 데이터베이스를 직접 고친다(GitHub 서버에서 API 주소가 막혀도 동작)
          R=""; [ "$ST" = "ok" ] && R=", reports = 0"
          npx --yes wrangler@3.99.0 d1 execute kimworld --remote --command "UPDATE comments SET status = '$ST', reviewed = 1$R WHERE id = $CID"

name: YT secrets sync
# 사이트 저장소에 유튜브 키(YT_CLIENT_ID·YT_CLIENT_SECRET·YT_REFRESH_TOKEN)를 넣는다(2026-11-20 운영자 "해결").
# 평문은 어디에도 지나가지 않는다: 세션이 이 저장소의 Actions 공개키로 봉인(sealed box)한 암호문만 입력으로 받고,
# 그대로 GitHub 비밀값 API에 넣는다(복호화는 GitHub만 할 수 있다). 필요한 비밀값: GH_SECRETS_PAT(token-refresh와 같음).
#  1) mode=pubkey  → 로그에 공개키와 key_id(공개 정보)
#  2) mode=set     → key_id, enc_client_id, enc_client_secret, enc_refresh_token(각 base64 암호문)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pubkey | set"
        required: true
        default: pubkey
      key_id:
        required: false
        default: ""
      enc_client_id:
        required: false
        default: ""
      enc_client_secret:
        required: false
        default: ""
      enc_refresh_token:
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run
        env:
          PAT: ${{ secrets.GH_SECRETS_PAT }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          KEY_ID: ${{ inputs.key_id }}
          E1: ${{ inputs.enc_client_id }}
          E2: ${{ inputs.enc_client_secret }}
          E3: ${{ inputs.enc_refresh_token }}
        run: |
          python3 - <<'EOF'
          import json, os, sys, urllib.request, urllib.error
          pat = os.environ.get("PAT", "")
          if not pat:
              print("::error::GH_SECRETS_PAT 없음"); sys.exit(1)
          repo = os.environ["REPO"]
          h = {"Authorization": f"Bearer {pat}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={**h, **({"Content-Type": "application/json"} if data else {})})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      t = r.read().decode() or "{}"; return r.status, json.loads(t)
              except urllib.error.HTTPError as e:
                  return e.code, {"message": e.read().decode()[:200]}
          base = f"https://api.github.com/repos/{repo}/actions/secrets"
          if os.environ["MODE"] == "pubkey":
              st, k = call("GET", base + "/public-key")
              print(f"::notice title=PUBKEY {st}::key_id={k.get('key_id')} key={k.get('key')}")
              sys.exit(0 if st == 200 else 1)
          if os.environ["MODE"] != "set":
              print("::error::mode는 pubkey 또는 set"); sys.exit(1)
          kid = os.environ["KEY_ID"]; bad = 0
          for name, env in (("YT_CLIENT_ID", "E1"), ("YT_CLIENT_SECRET", "E2"), ("YT_REFRESH_TOKEN", "E3")):
              enc = os.environ.get(env, "")
              if not enc:
                  print(f"::warning::{name} 암호문 없음 — 건너뜀"); continue
              st, r = call("PUT", f"{base}/{name}", {"encrypted_value": enc, "key_id": kid})
              print(f"::notice title={name}::HTTP {st}")
              bad += st not in (201, 204)
          sys.exit(1 if bad else 0)
          EOF

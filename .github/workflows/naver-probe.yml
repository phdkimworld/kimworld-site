name: Naver blog API probe (일회성 확인)
# 네이버 블로그 글쓰기 API(XML-RPC)가 아직 살아 있는지 가짜 값으로만 확인한다(비밀값 없음). 확인 뒤 지운다.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          body='<?xml version="1.0"?><methodCall><methodName>blogger.getUsersBlogs</methodName><params><param><value><string>x</string></value></param><param><value><string>kimworld_probe_nouser</string></value></param><param><value><string>wrong</string></value></param></params></methodCall>'
          for u in https://api.blog.naver.com/xmlrpc http://api.blog.naver.com/xmlrpc; do
            r=$(curl -s -m 20 -X POST "$u" -H 'Content-Type: text/xml' --data "$body" -w ' HTTP%{http_code}' | tr '\n' ' ' | cut -c1-600)
            echo "::notice title=probe $u::$r"
          done

name: Build and deploy

# main에 올라오면 검사 → 빌드 → GitHub Pages 배포.
# 매시 5분에도 다시 빌드한다(미래 날짜 리포트는 한국시간 0시 5분 빌드에 공개, 쿠팡 상품은 시간당 8개까지 갱신).
on:
  push:
    branches: [main]
    paths-ignore: ["social/queue/**", "social/posted/**", "social/README.md", ".github/workflows/social.yml", "scripts/social_publish.py", "tests/test_social.py", ".github/workflows/token-refresh.yml", "scripts/token_refresh.py"]   # SNS 대기열·기록만 바뀐 커밋은 사이트를 다시 배포하지 않는다(static/social/ 미디어는 배포해야 공개되므로 제외하지 않음)
  pull_request:
    branches: [main]
    paths-ignore: ["social/queue/**", "social/posted/**", "social/README.md", ".github/workflows/social.yml", "scripts/social_publish.py", "tests/test_social.py", ".github/workflows/token-refresh.yml", "scripts/token_refresh.py"]
  schedule:
    - cron: "5 * * * *"   # 매시 5분(UTC). 한국시간 0시 5분 예약 공개 포함, 쿠팡 상품을 시간당 8개씩 갱신
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.inx.outputs.urls }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"   # API 검사가 node 내장 SQLite를 쓴다
      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y -q fonts-noto-cjk >/dev/null   # 공유 이미지(카카오톡 미리보기)용 한글 글꼴
      - name: Test
        run: python tests/test_build.py
      - name: Restore Coupang products
        # 쿠팡 검색 API는 시간당 10회 제한이 있어, 받은 결과를 Actions 캐시로 다음 빌드에 넘긴다(저장소에는 올리지 않음)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: coupang-${{ github.run_id }}
          restore-keys: coupang-
      - name: Sync Coupang products
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
        run: python scripts/coupang_sync.py
      - name: Save Coupang products
        # 뒤 단계가 실패해도 호출 기록을 남겨야 다음 실행이 시간당 상한을 넘지 않는다
        if: always() && github.event_name != 'pull_request' && hashFiles('.cache/coupang_auto.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: coupang-${{ github.run_id }}
      - name: Ad stats (learning)
        # 쿠팡 상자 노출·클릭(지난 30일)을 받아 빌드가 ad-weights.json(브라우저가 묶음을 고르는 자료)을 만든다
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Cloudflare 비밀값 없음 → 건너뜀"; exit 0; }
          ID=$(npx --yes wrangler@3.99.0 d1 list --json | jq -r '.[] | select(.name=="kimworld") | .uuid' | head -1)
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          SINCE=$(date -u -d '30 days ago' +%F)
          mkdir -p ../.cache
          npx --yes wrangler@3.99.0 d1 execute kimworld --remote --json --command \
            "SELECT g, slot, seg, SUM(imps) AS imps, SUM(clicks) AS clicks FROM ad_stats WHERE day >= '$SINCE' GROUP BY g, slot, seg" > ../.cache/ad_stats.json
          python3 -c "import json;d=json.load(open('../.cache/ad_stats.json'));print('광고 성과 줄 수:', len(d[0]['results']))"
      - name: Build
        run: python build.py --strict
      - name: Board notices
        # 새 종목 종토방에 첫 글(종목 소개 + 규칙 공지)을 올리고, 새로 공개된 리포트를 그 종목·테마 팔로워에게 한 번 알린다(여러 번 돌려도 안전)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Cloudflare 비밀값 없음 → 건너뜀"; exit 0; }
          python ../scripts/board_notices.py > /tmp/notices.sql
          ID=$(npx --yes wrangler@3.99.0 d1 list --json | jq -r '.[] | select(.name=="kimworld") | .uuid' | head -1)
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml || true
          npx --yes wrangler@3.99.0 d1 execute kimworld --remote --file /tmp/notices.sql
      - name: IndexNow list
        # 지금 공개된 사이트맵과 비교해 새로 생기거나 바뀐 주소만 고른다(바뀐 것이 없으면 빈 목록)
        id: inx
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python scripts/indexnow.py diff dist/sitemap.xml > /tmp/inx.txt
          { echo 'urls<<INX_EOF'; cat /tmp/inx.txt; echo 'INX_EOF'; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.build.outputs.indexnow != ''
      - name: IndexNow submit
        # 배포가 끝난 뒤(키 파일이 공개된 뒤) 빙·네이버에 바뀐 주소를 알린다. 실패해도 배포에는 영향 없음
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          URLS: ${{ needs.build.outputs.indexnow }}
        run: |
          pip install -q pyyaml
          printf '%s\n' "$URLS" > /tmp/inx.txt
          python scripts/indexnow.py submit /tmp/inx.txt

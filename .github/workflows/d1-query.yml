name: D1 query (read-only)

# 다른 세션이 Cloudflare D1(워커 DB kimworld)을 읽는 유일한 통로(운영자 지시 2026-11-17 "클라우드플레어 다른 세션이 접근할수 있게").
# 세션 셸은 Cloudflare·api.drkimworld.com에 닿지 않고 토큰도 없다 → 이 워크플로를 dispatch 하고, 결과는 비공개 저장소
# phdkimworld/kimworld(ops-data) stats/query/<name>.json 에서 contents API로 읽는다. 공개 Actions 로그·주석에는 줄 수만 남긴다.
# 읽기 전용: SELECT/WITH 한 문장만, 쓰기·스키마 낱말 금지, 개인정보 표(계정·세션·쪽지·사진·키·질문 기록 등)는 거절.
# 쓰기는 이 워크플로로 하지 않는다: 스키마는 worker/migrations + api.yml, 댓글 상태는 api.yml 입력, 신고·운영자 지정은 moderate.yml.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: "SELECT 한 문장(LIMIT 권장, 끝 ; 없이)"
        required: true
      name:
        description: "결과 이름(영문 소문자·숫자·-_, 예: votes-1117) → stats/query/<name>.json"
        required: true

permissions:
  contents: read

concurrency:
  group: d1-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPS_PUSH_TOKEN: ${{ secrets.OPS_PUSH_TOKEN }}
      SQL: ${{ github.event.inputs.sql }}
      NAME: ${{ github.event.inputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check query
        run: python3 scripts/d1_guard.py
      - name: Run
        working-directory: worker
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=D1::Cloudflare 비밀값 없음"; exit 1; }
          [ -n "$OPS_PUSH_TOKEN" ] || { echo "::error title=D1::OPS_PUSH_TOKEN 없음(결과를 공개 로그에 남기지 않으므로 중단)"; exit 1; }
          ID=$(npx --yes wrangler@3.99.0 d1 list --json | jq -r '.[] | select(.name=="kimworld") | .uuid' | head -1)
          test -n "$ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          mkdir -p ../.cache
          npx --yes wrangler@3.99.0 d1 execute kimworld --remote --json --command "$SQL" > ../.cache/q.json 2> ../.cache/q.err || { echo "::error title=D1::실행 실패: $(head -c 300 ../.cache/q.err | tr '\n' ' ')"; exit 1; }
          python3 - <<'PY'
          import json, os, datetime
          d = json.load(open('../.cache/q.json'))
          rows = d[0].get('results', []) if isinstance(d, list) and d else []
          out = {"sql": os.environ["SQL"], "at": datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z", "rows": len(rows), "results": rows}
          json.dump(out, open('../.cache/q_out.json', 'w'), ensure_ascii=False, indent=1)
          print(f"::notice title=D1::{len(rows)}줄 → 비공개 stats/query/{os.environ['NAME']}.json")
          PY
      - name: Publish (private)
        run: scripts/ops_publish.sh .cache/q_out.json "query/${NAME}.json"

name: Threads drkimworld scheduled post (건강월드 정시 게시)

# 운영자 2026-11-27 '30일 루틴: 하루 2~3개, 같은 시각' + "토큰 사용 줄일 방법": 세션 대신 여기서 정시에 대기열 맨 위 글을 올린다.
# 대기열 social/threads_health/queue.json 은 세션이 채운다(공용 API 초안 + 검사). 비면 아무것도 안 함. 값은 출력하지 않는다.
on:
  schedule:
    # 11-27 빌리쌤 팁: 피크타임 아침 6~9시·저녁 20~24시(저녁 2배), 낮은 댓글 시간 → 하루 4개
    - cron: "27 22 * * *"   # 07:27 KST
    - cron: "47 23 * * *"   # 08:47 KST
    - cron: "7 12 * * *"    # 21:07 KST
    - cron: "47 13 * * *"   # 22:47 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: threads-health-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DRKIM_THREADS_ACCESS_TOKEN: ${{ secrets.DRKIM_THREADS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: CHANGED_FILE=/tmp/changed.txt python scripts/threads_health_post.py
      - name: Commit
        if: always()
        run: |
          [ -s /tmp/changed.txt ] || { echo "바뀐 기록 없음"; exit 0; }
          python scripts/llm.py commit -m "건강월드 Threads 정시 게시 $(TZ=Asia/Seoul date '+%m-%d %H:%M') KST" $(cat /tmp/changed.txt)

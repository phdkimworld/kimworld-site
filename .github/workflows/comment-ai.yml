name: Comment AI (댓글 질문·의견 자동 답글)

# 운영자 지시 2026-11-11: 유튜브·Threads·페이스북 시청자 첫 댓글 가운데 질문·의견을 저가 모델로 답한다(scripts/comment_ai.py).
#  - 리포트 본문을 근거로 넣고, 생성 뒤 규칙 검사(150자·금지어·숫자가 리포트에 있는지·기준 날짜·링크)를 통과한 것만 게시.
#  - 종목 요청·대댓글·AI 질문·스팸·투표·감사·인스타그램 댓글은 하지 않는다(지금처럼 미디어 hourly.py·세션·인스타팀 몫).
#  - 장부 social/llm/comments/state.json(posted/left)을 미디어 tools/hourly.py 가 읽어 중복을 피한다.
#  - ANTHROPIC_API_KEY 가 없거나(no_key) 크레딧이 없으면(no_credit) 아무것도 하지 않고 성공으로 끝난다.
#  - 월 예산: social/llm/usage.json 장부(scripts/llm.py, comments 40달러, 전체 120달러).
# 필요한 비밀값: ANTHROPIC_API_KEY, YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN(미디어 저장소 업로드와 같은 이름·값),
#               THREADS_ACCESS_TOKEN, FB_PAGE_ID, FB_PAGE_TOKEN. 값은 출력하지 않는다.
on:
  schedule:
    - cron: "15 * * * *"   # 매시 15분(SNS 목록 12분·배포 5분과 겹치지 않게)
  workflow_dispatch:
    inputs:
      dry:
        description: "1이면 답을 만들고 검사만 한다(게시·장부 없음)"
        required: false
        default: ""
      max:
        description: "이번 실행 최대 처리 수(기본 15)"
        required: false
        default: "15"

permissions:
  contents: write

concurrency:
  group: comment-ai
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      DRY: ${{ github.event.inputs.dry }}
      MAX: ${{ github.event.inputs.max || '15' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_llm.py > /dev/null
      - name: Run
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::STATUS=no_key — 건너뜀(지금처럼 hourly.py·세션이 처리)"; echo "### STATUS=no_key" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          case "$MAX" in ''|*[!0-9]*) MAX=15;; esac
          if [ "$DRY" = "1" ]; then python scripts/comment_ai.py --dry --max "$MAX"; exit 0; fi
          CHANGED_FILE=/tmp/changed.txt python scripts/comment_ai.py --max "$MAX"
          python scripts/llm.py status >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        # 일부가 실패해도 이미 단 답글 기록은 반드시 커밋한다(중복 답글 방지). usage.json 은 원격 최신본에 다시 더해 올린다
        if: always() && env.DRY != '1'
        run: |
          [ -s /tmp/changed.txt ] || { echo "바뀐 기록 없음"; exit 0; }
          python scripts/llm.py commit -m "댓글 AI 답글 기록 $(TZ=America/New_York date '+%m-%d %H:%M') ET" $(cat /tmp/changed.txt)

# 두 번째 Threads 계정 @drkimworld (2026-11-25 운영자 "drkimworld로 채널이 이미 있는데 로그인해서 연결해봐")
# 같은 Meta 앱(phdkimworld-poster)의 Threads 테스터. 토큰은 비밀값 DRKIM_THREADS_ACCESS_TOKEN(60일, token-refresh.yml 이 매달 1·15일 갱신).
# mode ping: 토큰 확인(계정 아이디만 주석에). mode post: text 를 그대로 한 글 게시(운영자가 승인한 글만).
# 게시 주체: 건강월드 매일 운영(미디어 skill/health/HEALTH_CHANNEL.md 4.17, 운영자 승인 형식, 하루 1~2개 mode=post + reply).
#   그래서 이 워크플로 자체의 정기 실행은 두지 않는다(같은 계정에 두 갈래로 올라가지 않게, 2026-11-26).
# mode health(손으로만, 예비): scripts/health_threads.py 가 건강몰 가이드 한 성분을 골라 만든 글
#   (가이드의 '고를 때 확인할 것' + 식약처 인정 기능성 문구 그대로 + 가이드 링크 UTM, 쿠팡 링크 없음) — 2026-11-25 운영자 "니가 직접 할수 있는 방식 아무거나 해"
# mode preview: health 글을 게시하지 않고 주석에 보여 줌.
# mode delete: ids(쉼표) 의 이 계정 글을 지움(2026-11-26 옛 형식 글 정리).
# 2026-11-26 운영자 "제품을 먼저 달고 그 밑에 몰 주소도 달아": 마지막 조각 = 대가성 문구 → 쿠팡 단축 링크 → 그 밑에 건강몰 링크(본문엔 링크 없음).
name: Threads drkimworld

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ping(토큰 확인) / post(글 게시) / health(건강몰 오늘 글 게시) / preview(health 글 미리보기) / links(쿠팡 링크 든 글 목록)"
        required: true
        default: ping
      text:
        description: "post 용 본문(500자 이내)"
        required: false
        default: ""
      ids:
        description: "delete 용 게시 id(쉼표로 여러 개, 최대 20). @drkimworld 글만 지운다"
        required: false
        default: ""
      topic:
        description: "주제 태그 1개(선택, 예: 영양제) — 운영자 11-27 '주제 태그 1개 정확히'"
        required: false
        default: ""
      reply:
        description: "post 뒤 내 답글. 여러 개면 줄 하나에 === 로 나눔(각 500자 이내, 링크는 마지막 조각에만 — 첫 줄 대가성 문구, 쿠팡 단축 링크만). 비우면 답글 없음"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOKEN: ${{ secrets.DRKIM_THREADS_ACCESS_TOKEN }}
      MODE: ${{ inputs.mode }}
      TEXT: ${{ inputs.text }}
      REPLY: ${{ inputs.reply }}
      IDS: ${{ inputs.ids }}
      TOPIC: ${{ inputs.topic }}
    steps:
      - uses: actions/checkout@v4
        if: env.MODE == 'health' || env.MODE == 'preview'
      - name: Compose health post
        if: env.MODE == 'health' || env.MODE == 'preview'
        run: |
          pip install -q pyyaml
          python3 scripts/health_threads.py > /tmp/post.txt
          echo "TEXT_FILE=/tmp/post.txt" >> "$GITHUB_ENV"
      - name: Run
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.parse, urllib.request, urllib.error
          API = "https://graph.threads.net/v1.0"
          tok = os.environ.get("TOKEN", "")
          if not tok:
              print("::error::DRKIM_THREADS_ACCESS_TOKEN 비밀값이 없음"); sys.exit(1)
          print(f"::add-mask::{tok}")
          def call(method, path, params):
              params = dict(params, access_token=tok)
              q = urllib.parse.urlencode(params)
              req = urllib.request.Request(f"{API}/{path}?{q}" if method in ("GET", "DELETE") else f"{API}/{path}",
                                           data=None if method in ("GET", "DELETE") else q.encode(), method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  err = json.loads(e.read() or b"{}").get("error", {})
                  print(f"::error::HTTP {e.code} {err.get('type','')} code={err.get('code','')}: {err.get('message','')}"); sys.exit(1)
          me = call("GET", "me", {"fields": "id,username"})
          print(f"::notice::토큰 정상: @{me.get('username')}")
          if os.environ["MODE"] == "ping":
              sys.exit(0)
          mode = os.environ["MODE"]
          if mode == "delete":
              # 2026-11-26 운영자 "맥락이 전혀 없고 그냥 광고로 보이잖아 … 알아서 다 고쳐": 옛 형식 글 지우기(이 계정 글만, 답글 먼저)
              ids = [x.strip() for x in os.environ.get("IDS", "").split(",") if x.strip().isdigit()][:20]
              if not ids:
                  print("::error::ids 없음"); sys.exit(1)
              bad = 0
              for i in ids:
                  m = call("GET", i, {"fields": "id,username"})
                  if m.get("username") != me.get("username"):
                      print(f"::error::{i} 은 이 계정 글이 아님"); bad += 1; continue
                  call("DELETE", i, {})
                  print(f"::notice::지움 {i}")
                  time.sleep(2)
              sys.exit(1 if bad else 0)
          # 2026-11-26 운영자가 보낸 '초반 30분' 운영 글 참고: 게시 30분 안에 내 글 답글에 빠르게 대댓(answer),
          # 30분 뒤 내 글을 인용해 한 줄 더 얹기(quote). 남의 글에 자동 댓글·리포스트 풀었다 다시 하기는 하지 않는다(스팸·조작으로 보일 수 있음).
          if mode == "replies":
              # ids 의 내 글(첫 번째)에 달린 답글 목록 — 내 계정 글은 빼고 아이디·글만 주석으로
              pid = (os.environ.get("IDS", "").split(",") or [""])[0].strip()
              if not pid.isdigit():
                  print("::error::ids 에 내 글 id 하나"); sys.exit(1)
              r = call("GET", f"{pid}/conversation", {"fields": "id,text,username,timestamp,replied_to", "reverse": "false"})
              n = 0
              for x in r.get("data", []):
                  if x.get("username") == me.get("username"):
                      continue
                  n += 1
                  t = (x.get("text") or "").replace("\n", " ")[:300]
                  print(f"::notice::답글 {x.get('id')} @{x.get('username')} {x.get('timestamp')}: {t}")
              print(f"::notice::남이 단 답글 {n}개"); sys.exit(0)
          if mode in ("answer", "quote"):
              # answer: ids 의 답글(첫 번째)에 text 로 대댓 / quote: ids 의 내 글을 인용해 text 한 글. 둘 다 링크 금지
              tid = (os.environ.get("IDS", "").split(",") or [""])[0].strip()
              text = os.environ.get("TEXT", "").strip()
              if not tid.isdigit() or not text or len(text) > 500 or re.search(r"https?://", text):
                  print("::error::ids 하나, text 1~500자, 링크 없음"); sys.exit(1)
              if mode == "quote":
                  q = call("GET", tid, {"fields": "id,username"})
                  if q.get("username") != me.get("username"):
                      print("::error::인용은 이 계정 글만"); sys.exit(1)
              params = {"media_type": "TEXT", "text": text}
              params["reply_to_id" if mode == "answer" else "quote_post_id"] = tid
              c = call("POST", "me/threads", params)
              time.sleep(5)
              p = call("POST", "me/threads_publish", {"creation_id": c["id"]})
              print(f"::notice::{'대댓' if mode == 'answer' else '인용'} 게시됨 id={p.get('id')}"); sys.exit(0)
          if mode == "links":
              # 2026-11-28 운영자 "건강 쓰레드 채널아냐?"(하위 ID 없는 쿠팡 클릭 출처): 이 계정 글·답글 전체에서 쿠팡 링크가 든 것만 날짜·주소·링크로
              rows = []
              for edge in ("threads", "replies"):
                  path, prm = f"me/{edge}", {"fields": "id,text,timestamp,permalink", "limit": 100}
                  for _ in range(30):
                      r = call("GET", path, prm)
                      for x in r.get("data", []):
                          ls = re.findall(r"https?://(?:link\.coupang\.com|coupa\.ng|www\.coupang\.com)/\S+", x.get("text") or "")
                          if ls:
                              rows.append(f"{(x.get('timestamp') or '')[:10]} {edge} {x.get('permalink') or x.get('id')} {' '.join(sorted(set(ls)))}")
                      nxt = (r.get("paging") or {}).get("cursors", {}).get("after")
                      if not nxt or not r.get("data"):
                          break
                      prm = dict(prm, after=nxt)
              rows.sort()
              print(f"::notice title=쿠팡 링크 든 글 {len(rows)}개::" + "%0A".join(rows[:300]))
              sys.exit(0)
          if mode not in ("post", "health", "preview"):
              print("::error::mode 는 ping·post·health·preview·delete·replies·answer·quote"); sys.exit(1)
          text = (open(os.environ["TEXT_FILE"], encoding="utf-8").read() if mode in ("health", "preview") else os.environ.get("TEXT", "")).strip()
          if mode == "preview":
              print("::notice::" + text.replace("\n", "%0A")); sys.exit(0)
          if not text or len(text) > 500:
              print("::error::text 는 1~500자"); sys.exit(1)
          import re
          reply = os.environ.get("REPLY", "").strip() if mode == "post" else ""
          if mode == "post" and re.search(r"https?://", text):
              print("::error::본문에는 링크를 넣지 않는다(링크는 reply)"); sys.exit(1)
          # 2026-11-26 대형 계정 참고: 본문 → 이어지는 글(링크 없음) → 마지막 답글(대가성 문구 + 쿠팡 링크). reply 안 '\n===\n' 로 이어 단다.
          parts = [x.strip() for x in reply.split("\n===\n") if x.strip()] if reply else []
          for k, pt in enumerate(parts):
              urls = re.findall(r"https?://\S+", pt)
              if len(pt) > 500 or (urls and ("쿠팡 파트너스" not in pt.split("\n")[0] or k != len(parts) - 1)) or \
                 any(not re.match(r"https://(link\.coupang\.com/a/|health\.drkimworld\.com/)", u) for u in urls) or \
                 (urls and not re.match(r"https://link\.coupang\.com/a/", urls[0])):
                  print("::error::reply 조각은 500자 이내, 링크는 마지막 조각에만(첫 줄 대가성 문구, 쿠팡 단축 링크 먼저 그 밑에 건강몰)"); sys.exit(1)
          first = {"media_type": "TEXT", "text": text}
          tp = re.sub(r"[^0-9A-Za-z가-힣]", "", os.environ.get("TOPIC", ""))[:50]
          if tp and mode == "post":
              first["topic_tag"] = tp
          c = call("POST", "me/threads", first)
          time.sleep(5)
          p = call("POST", "me/threads_publish", {"creation_id": c["id"]})
          print(f"::notice::게시됨 id={p.get('id')}")
          prev = p["id"]
          for pt in parts:
              time.sleep(5)
              c2 = call("POST", "me/threads", {"media_type": "TEXT", "text": pt, "reply_to_id": prev})
              time.sleep(5)
              p2 = call("POST", "me/threads_publish", {"creation_id": c2["id"]})
              prev = p2.get("id")
              print(f"::notice::답글 게시됨 id={prev}")
          PY

name: Weekly AI (주간 성과 요약·개선안)

# 운영자 지시 2026-11-11: 매주 월요일 1회, 사이트 저장소 기록과 사이트 비밀값으로 닿는 공개 통계만으로
# 지난 7일 요약과 다음 회차 개선안 3~5개를 social/llm/weekly/<날짜>.md 에 쓴다(scripts/weekly_ai.py, 월 예산 weekly 10달러).
# 공개 저장소이므로 수익·광고 실적·검색어 원문·사용자 정보는 입력·출력 모두에서 뺀다(AGENTS.md 8장).
# 키가 없거나(no_key) 크레딧이 없으면(no_credit) 건너뛰고 성공으로 끝난다.
on:
  schedule:
    - cron: "41 11 * * 1"   # 매주 월요일 11:41 UTC(한국 20:41, 미 동부 06:41/07:41)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ai
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_IN: ${{ secrets.KIMWORLD_ADMIN_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::notice::STATUS=no_key — 주간 분석 건너뜀"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Fetch analytics (traffic only)
        # analytics-report.yml 과 같은 방법. 응답은 .cache(커밋하지 않음)에만 두고, weekly_ai.py 가 트래픽 항목만 고른다
        if: env.SKIP != '1' && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: |
          ADMIN=${ADMIN_IN:-$(printf '%s' "$CLOUDFLARE_API_TOKEN:admin" | sha256sum | cut -c1-40)}
          echo "::add-mask::$ADMIN"
          mkdir -p .cache
          SUB=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          BASE=${SUB:+https://kimworld-api.$SUB.workers.dev}; BASE=${BASE:-https://api.drkimworld.com}
          CODE=$(curl -sS --max-time 60 -o .cache/an.json -w '%{http_code}' -A "kimworld-ops-report" -H "Authorization: Bearer $ADMIN" "$BASE/v1/admin/analytics?days=7")
          echo "analytics HTTP $CODE"
          [ "$CODE" = "200" ] || rm -f .cache/an.json
      - name: Write weekly memo
        if: env.SKIP != '1'
        run: |
          CHANGED_FILE=/tmp/changed.txt python scripts/weekly_ai.py
          rm -f .cache/an.json
          python scripts/llm.py status >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: env.SKIP != '1'
        run: |
          [ -s /tmp/changed.txt ] || { echo "바뀐 기록 없음"; exit 0; }
          python scripts/llm.py commit -m "주간 성과 메모 $(TZ=America/New_York date '+%Y-%m-%d')" $(cat /tmp/changed.txt)

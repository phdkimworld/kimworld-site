name: Analytics report (운영 통계 요약)

# 매일 클로드 예약 작업이 실행해 지난 7일 운영 통계 요약을 주석으로 받아 보고 개선점을 찾는다.
# 저장소가 공개라 주석도 공개된다: OPS_PUSH_TOKEN이 있으면 요약을 비공개 저장소 phdkimworld/kimworld(ops-data) stats/analytics.json 에만 둔다. 없으면 공개 주석(수익 제외). 2026-10-28
on:
  schedule:
    - cron: "40 3 * * *"   # 매일 03:40 UTC(한국 12:40). 최신 요약을 비공개 저장소에 둔다(애드핏 기록은 서버 D1에만)
  workflow_dispatch:
    inputs:
      days:
        description: "집계 기간 7·30·90일 중 하나. 비우면 7"
        required: false

permissions:
  contents: write   # 옛 애드핏 CSV 삭제 커밋(한 번)

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_IN: ${{ secrets.KIMWORLD_ADMIN_TOKEN }}
      DAYS_IN: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch analytics
        run: |
          ADMIN=${ADMIN_IN:-$(printf '%s' "$CLOUDFLARE_API_TOKEN:admin" | sha256sum | cut -c1-40)}
          echo "::add-mask::$ADMIN"
          mkdir -p .cache
          case "$DAYS_IN" in 30|90) DAYS=$DAYS_IN;; *) DAYS=7;; esac   # 워커가 7·30·90만 받는다
          # api.drkimworld.com 은 Cloudflare 봇 검사가 GitHub 러너를 막으므로(403 'Just a moment') 같은 워커의 workers.dev 주소로 부른다
          SUB=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          BASE=${SUB:+https://kimworld-api.$SUB.workers.dev}
          BASE=${BASE:-https://api.drkimworld.com}
          CODE=$(curl -sS --max-time 60 -o .cache/an.json -w '%{http_code}' -A "kimworld-ops-report" -H "Authorization: Bearer $ADMIN" "$BASE/v1/admin/analytics?days=$DAYS")
          echo "::notice title=AN HTTP::$CODE $(wc -c < .cache/an.json) bytes · ${BASE}"
          if [ "$CODE" != "200" ]; then echo "::notice title=AN BODY::$(head -c 300 .cache/an.json | tr -d '\r\n%')"; fi
      - name: Import old AdFit CSV (one time)
        # 공개 저장소에 있던 data/adfit_daily.csv 를 비공개 D1로 옮기고 파일을 지운다(2026-10-28 비공개 전환)
        run: |
          if [ ! -f data/adfit_daily.csv ]; then exit 0; fi
          ADMIN=${ADMIN_IN:-$(printf '%s' "$CLOUDFLARE_API_TOKEN:admin" | sha256sum | cut -c1-40)}
          echo "::add-mask::$ADMIN"
          SUB=$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          BASE=${SUB:+https://kimworld-api.$SUB.workers.dev}; BASE=${BASE:-https://api.drkimworld.com}
          python3 -c "import csv,json;print(json.dumps({'adfit':list(csv.DictReader(open('data/adfit_daily.csv',encoding='utf-8')))},ensure_ascii=False))" > .cache/af_import.json
          CODE=$(curl -sS --max-time 60 -o .cache/af_imp_res.json -w '%{http_code}' -A "kimworld-ops-report" -H "Authorization: Bearer $ADMIN" -H "Content-Type: application/json" --data @.cache/af_import.json "$BASE/v1/admin/revenue-import")
          echo "::notice title=ADFIT IMPORT::HTTP $CODE"
          test "$CODE" = "200"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q data/adfit_daily.csv
          git commit -q -m "애드핏 기록을 비공개 D1로 옮기고 공개 파일 삭제"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
      - name: Report
        # 비공개 저장소 토큰(OPS_PUSH_TOKEN)이 있으면 전체 요약을 비공개 저장소에만 올리고 공개 주석은 남기지 않는다. 없으면 공개 주석(수익 제외)
        env:
          OPS_PUSH_TOKEN: ${{ secrets.OPS_PUSH_TOKEN }}
        run: |
          if [ -n "$OPS_PUSH_TOKEN" ]; then
            JSON_OUT=.cache/analytics.json NO_ANNOTATIONS=1 python3 scripts/analytics_report.py
            scripts/ops_publish.sh .cache/analytics.json analytics
          else
            python3 scripts/analytics_report.py
          fi

# 김박사 건강월드 유튜브 작업(업로드·썸네일·주제별 통계·재생목록·채널 정보·댓글)을 이 저장소의 HEALTH_YT_* 비밀값으로 실행(운영자 2026-11-20 "깃헙에서 갖다써").
# 키는 이 저장소 밖으로 나가지 않는다(값·토큰을 출력하지 않음). 영상·도구·메타는 운영자 맥(healthworld-ops 실행기)이 이 저장소의
# 릴리스(tag 입력, 예: hw-2026-11-20)에 자산으로 올리고 이 워크플로를 손 실행한다. 결과(영상 id 장부·댓글 목록)는 같은 릴리스 자산으로 돌려준다.
# 도구 원본: 비공개 phdkimworld/healthworld-ops tools/hw_upload.py·hw_channel.py·hw_comments.py·hw_stats.py·hw_reach.py (채널 ID가 건강월드가 아니면 아무것도 안 함).
name: Health YT run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "자산이 있는 릴리스 태그(예: hw-2026-11-20)"
        required: true
      mode:
        description: "upload | thumbs | stats | reach | channel | comments | reply | hide | unhide | desc"
        required: true
        default: upload
      videos:
        description: "hide/unhide 용 영상 id(쉼표로 여러 개, 최대 10). 건강월드 채널 영상만 바뀐다"
        required: false
        default: ""
      edits:
        description: "desc 용 JSON [{\"v\":\"영상id\",\"line\":\"▶ … https://link.coupang.com/a/…\"}](최대 12편) 또는 {\"auto\":{\"성분\":\"▶ … 쿠팡 링크\"},\"comments\":true} — 채널 전체에서 몰 가이드 링크 줄을 쿠팡 줄로"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: health-yt-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEALTH_YT_CLIENT_ID: ${{ secrets.HEALTH_YT_CLIENT_ID }}
      HEALTH_YT_CLIENT_SECRET: ${{ secrets.HEALTH_YT_CLIENT_SECRET }}
      HEALTH_YT_REFRESH_TOKEN: ${{ secrets.HEALTH_YT_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      MODE: ${{ inputs.mode }}
      VIDEOS: ${{ inputs.videos }}
      EDITS: ${{ inputs.edits }}
    steps:
      - name: Get assets
        if: inputs.mode != 'hide' && inputs.mode != 'unhide' && inputs.mode != 'desc'
        run: |
          mkdir -p a && cd a && gh release download "$TAG" -R "$GITHUB_REPOSITORY" --clobber
          ls -la
      - name: Run
        run: |
          pip install -q google-api-python-client google-auth
          if [ "$MODE" = desc ]; then
            # 설명란 첫 '▶ ' 줄(몰 링크 줄) 바꾸기(2026-11-25 운영자: '뒷면 숫자' 롱폼은 쿠팡 검색 결과 링크로 직행, 효과 판정·증상형은 몰 링크 유지).
            # 건강월드 채널 영상만, 첫 줄 대가성 문구가 있어야 하고, 새 줄은 link.coupang.com 또는 health.drkimworld.com 링크 하나만. 제목·태그·분류는 그대로.
            python3 - <<'PY'
          import json, os, re, sys
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          CH = "UCNh9LrCUc0nTPKLMWPhnviw"
          DISC = "쿠팡 파트너스 활동의 일환"
          try:
              E = json.loads(os.environ.get("EDITS") or "[]")
          except Exception:
              print("::error::edits JSON 오류"); sys.exit(1)
          ok = lambda e: isinstance(e, dict) and re.fullmatch(r"[A-Za-z0-9_-]{11}", str(e.get("v", ""))) and str(e.get("line", "")).startswith("▶ ") \
              and "\n" not in e["line"] and len(e["line"]) <= 300 and len(re.findall(r"https://", e["line"])) == 1 \
              and re.search(r"https://(link\.coupang\.com/a/[A-Za-z0-9]+|health\.drkimworld\.com/[^\s]*)$", e["line"])
          if isinstance(E, dict) and isinstance(E.get("auto"), dict):
              # 2026-11-26 운영자 "영상에도 그냥 다 제품 링크를 달아": 채널의 모든 영상에서 몰 가이드 링크가 든 '▶ ' 줄(설명란, comments=true면 채널 자신의 댓글도)을
              # 그 가이드 성분의 쿠팡 줄로. 이미 바뀐 영상은 건너뛰고, 할당량이 끝나면 멈춘다(다시 돌리면 이어서).
              AUTO = E["auto"]; DO_C = bool(E.get("comments"))
              if not AUTO or not all(re.fullmatch(r"[a-z0-9-]+", k) and isinstance(x, str) and x.startswith("▶ ") and "\n" not in x and len(x) <= 300
                                     and re.search(r"https://link\.coupang\.com/a/[A-Za-z0-9]+$", x) for k, x in AUTO.items()):
                  print("::error::auto 는 {성분: '▶ … https://link.coupang.com/a/…'}"); sys.exit(1)
              from googleapiclient.errors import HttpError
              cr = Credentials(None, refresh_token=os.environ["HEALTH_YT_REFRESH_TOKEN"], token_uri="https://oauth2.googleapis.com/token",
                               client_id=os.environ["HEALTH_YT_CLIENT_ID"], client_secret=os.environ["HEALTH_YT_CLIENT_SECRET"])
              yt = build("youtube", "v3", credentials=cr, cache_discovery=False)
              GL = re.compile(r"^▶ .*https://health\.drkimworld\.com/guide/([a-z0-9-]+)/\S*$")
              ch = yt.channels().list(part="contentDetails", mine=True).execute()["items"][0]
              if ch["id"] != CH:
                  print("::error::건강월드 채널이 아님"); sys.exit(1)
              up = ch["contentDetails"]["relatedPlaylists"]["uploads"]; ids = []; tok = None
              while True:
                  r = yt.playlistItems().list(part="contentDetails", playlistId=up, maxResults=50, pageToken=tok).execute()
                  ids += [i["contentDetails"]["videoId"] for i in r.get("items", [])]
                  tok = r.get("nextPageToken")
                  if not tok: break
              nd = nc = skip = 0
              def swap(text):
                  L = text.split("\n"); hit = False
                  for k, x in enumerate(L):
                      m = GL.match(x)
                      if m and m.group(1) in AUTO:
                          L[k] = AUTO[m.group(1)]; hit = True
                  return ("\n".join(L) if hit else None)
              try:
                  for j in range(0, len(ids), 50):
                      for v in yt.videos().list(part="snippet", id=",".join(ids[j:j + 50])).execute().get("items", []):
                          sn = v["snippet"]
                          if sn["channelId"] != CH or DISC not in sn.get("description", "").split("\n")[0]:
                              skip += 1; continue
                          nd_ = swap(sn["description"])
                          if nd_:
                              body = {"id": v["id"], "snippet": {k: sn[k] for k in ("title", "categoryId", "tags", "defaultLanguage", "defaultAudioLanguage") if k in sn}}
                              body["snippet"]["description"] = nd_
                              yt.videos().update(part="snippet", body=body).execute(); nd += 1
                              print(f"::notice::{v['id']} 설명란 → 쿠팡")
                          if DO_C:
                              try:
                                  ths = yt.commentThreads().list(part="snippet", videoId=v["id"], maxResults=20, order="relevance").execute().get("items", [])
                              except HttpError as e:
                                  if "quota" in str(e).lower(): raise
                                  ths = []  # 댓글 꺼진 영상 등
                              for t in ths:
                                  c = t["snippet"]["topLevelComment"]
                                  if c["snippet"].get("authorChannelId", {}).get("value") != CH:
                                      continue
                                  nt = swap(c["snippet"].get("textOriginal", ""))
                                  if nt:
                                      yt.comments().update(part="snippet", body={"id": c["id"], "snippet": {"textOriginal": nt}}).execute(); nc += 1
                                      print(f"::notice::{v['id']} 고정 댓글 → 쿠팡")
              except HttpError as e:
                  if "quota" in str(e).lower():
                      print(f"::warning::할당량 끝 — 설명란 {nd}·댓글 {nc} 바꿈, 내일 다시 돌리면 이어서"); sys.exit(0)
                  raise
              print(f"::notice::완료: 영상 {len(ids)} · 설명란 {nd} · 댓글 {nc} · 건너뜀 {skip}"); sys.exit(0)
          if not E or len(E) > 12 or not all(ok(e) for e in E):
              print("::error::edits 는 1~12개, line 은 '▶ '로 시작하고 끝에 쿠팡 단축·건강몰 링크 하나"); sys.exit(1)
          cr = Credentials(None, refresh_token=os.environ["HEALTH_YT_REFRESH_TOKEN"], token_uri="https://oauth2.googleapis.com/token",
                           client_id=os.environ["HEALTH_YT_CLIENT_ID"], client_secret=os.environ["HEALTH_YT_CLIENT_SECRET"])
          yt = build("youtube", "v3", credentials=cr, cache_discovery=False)
          want = {e["v"]: e["line"] for e in E}; bad = 0
          for v in yt.videos().list(part="snippet", id=",".join(want)).execute().get("items", []):
              sn = v["snippet"]
              if sn["channelId"] != CH:
                  print(f"::error::{v['id']} 은 건강월드 영상이 아님"); bad += 1; continue
              L = sn.get("description", "").split("\n")
              if not L or DISC not in L[0]:
                  print(f"::error::{v['id']} 첫 줄 대가성 문구 없음 — 건드리지 않음"); bad += 1; continue
              i = next((k for k, x in enumerate(L) if x.startswith("▶ ")), None)
              if i is None:
                  print(f"::warning::{v['id']} '▶ ' 줄 없음 — 둘째 줄에 넣음"); L.insert(1, want[v["id"]])
              elif L[i] == want[v["id"]]:
                  print(f"::notice::{v['id']} 이미 같음"); want.pop(v["id"]); continue
              else:
                  L[i] = want[v["id"]]
              body = {"id": v["id"], "snippet": {k: sn[k] for k in ("title", "categoryId", "tags", "defaultLanguage", "defaultAudioLanguage") if k in sn}}
              body["snippet"]["description"] = "\n".join(L)
              yt.videos().update(part="snippet", body=body).execute()
              print(f"::notice::{v['id']} 설명란 링크 줄 교체")
              want.pop(v["id"])
          for x in want:
              print(f"::warning::{x} 를 찾지 못함"); bad += 1
          sys.exit(1 if bad else 0)
          PY
            exit $?
          fi
          if [ "$MODE" = hide ] || [ "$MODE" = unhide ]; then
            # 잘못 올라간 편 숨기기(비공개) / 되돌리기(공개). 지우지 않는다(되돌릴 수 있게). 2026-11-22 운영자 "제작팀이 권한이 없다는데"
            python3 - <<'PY'
          import os, re, sys
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          CH = "UCNh9LrCUc0nTPKLMWPhnviw"
          ids = [x.strip() for x in os.environ.get("VIDEOS", "").split(",") if x.strip()]
          if not ids or len(ids) > 10 or not all(re.fullmatch(r"[A-Za-z0-9_-]{11}", x) for x in ids):
              print("::error::videos 에 영상 id 1~10개(11자)를 쉼표로"); sys.exit(1)
          cr = Credentials(None, refresh_token=os.environ["HEALTH_YT_REFRESH_TOKEN"], token_uri="https://oauth2.googleapis.com/token",
                           client_id=os.environ["HEALTH_YT_CLIENT_ID"], client_secret=os.environ["HEALTH_YT_CLIENT_SECRET"])
          yt = build("youtube", "v3", credentials=cr, cache_discovery=False)
          to = "private" if os.environ["MODE"] == "hide" else "public"
          bad = 0
          for v in yt.videos().list(part="snippet,status", id=",".join(ids)).execute().get("items", []):
              if v["snippet"]["channelId"] != CH:
                  print(f"::error::{v['id']} 은 건강월드 영상이 아님 — 건드리지 않음"); bad += 1; continue
              W = ("embeddable", "license", "publicStatsViewable", "selfDeclaredMadeForKids", "containsSyntheticMedia")
              st = {k: v["status"][k] for k in W if k in v["status"]}  # 쓸 수 있는 칸만 그대로 두고 공개 상태만 바꿈
              st["privacyStatus"] = to
              yt.videos().update(part="status", body={"id": v["id"], "status": st}).execute()
              print(f"::notice::{v['id']} → {to}")
              ids.remove(v["id"])
          for x in ids:
              print(f"::warning::{x} 를 찾지 못함"); bad += 1
          sys.exit(1 if bad else 0)
          PY
            exit $?
          fi
          cd a
          case "$MODE" in
            upload)
              mkdir -p out
              for f in *__*.mp4 *__*.jpg; do [ -e "$f" ] || continue; s=${f%%__*}; mkdir -p out/$s; cp "$f" "out/$s/${f#*__}"; done
              rc=0; python3 hw_upload.py meta.json out uploaded.json || rc=$?
              [ -s uploaded.json ] && gh release upload "$TAG" uploaded.json --clobber -R "$GITHUB_REPOSITORY"
              exit $rc ;;
            thumbs)
              mkdir -p out
              for f in *__*.jpg; do [ -e "$f" ] || continue; s=${f%%__*}; mkdir -p out/$s; cp "$f" "out/$s/${f#*__}"; done
              python3 hw_upload.py meta.json out uploaded.json --thumbs ;;
            stats) python3 hw_stats.py uploaded.json stats.json && gh release upload "$TAG" stats.json --clobber -R "$GITHUB_REPOSITORY" ;;
            reach) python3 hw_reach.py uploaded.json reach.json && gh release upload "$TAG" reach.json --clobber -R "$GITHUB_REPOSITORY" ;;  # 노출·CTR(Reporting API, 2026-11-22)
            channel) python3 hw_channel.py ;;
            comments) python3 hw_comments.py fetch comments.json && gh release upload "$TAG" comments.json --clobber -R "$GITHUB_REPOSITORY" ;;
            reply) python3 hw_comments.py reply replies.json replied.json; [ -s replied.json ] && gh release upload "$TAG" replied.json --clobber -R "$GITHUB_REPOSITORY" ;;
            *) echo "::error::mode는 upload|thumbs|stats|reach|channel|comments|reply|hide|unhide|desc"; exit 1 ;;
          esac

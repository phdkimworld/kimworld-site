name: Threads (예약 게시)

# threads/queue/*.json 가운데 publish_at(미국 동부시간)이 지난 글을 Threads에 게시하고 threads/posted/ 로 옮긴다.
# 15분마다 실행(GitHub 예약 실행은 몇 분 늦을 수 있다). 대기열 파일이 바뀌어 올라와도 바로 검사한다.
# 필요한 GitHub 비밀값: THREADS_ACCESS_TOKEN, THREADS_USER_ID
# 500자 초과·형식 오류·게시 실패가 있으면 실패로 표시된다. 매주 월요일 토큰이 살아 있는지도 확인한다.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 13 * * 1"   # 매주 월요일 13:17 UTC 토큰 확인
  push:
    branches: [main]
    paths: ["threads/queue/**", "scripts/threads_publish.py", ".github/workflows/threads.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "publish(기본) / check(검사만) / ping(토큰 확인)"
        required: false
        default: "publish"

permissions:
  contents: write

concurrency:
  group: threads
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test
        run: python tests/test_threads.py > /dev/null
      - name: Token check
        if: github.event.schedule == '17 13 * * 1' || github.event.inputs.mode == 'ping'
        run: python scripts/threads_publish.py --ping
      - name: Publish due posts
        if: github.event.schedule != '17 13 * * 1' && github.event.inputs.mode != 'ping'
        run: |
          if [ "$MODE" = "check" ]; then
            python scripts/threads_publish.py --check
          else
            python scripts/threads_publish.py
          fi
      - name: Commit moved posts
        # 게시에 일부 실패해도, 이미 게시한 글은 반드시 posted/ 로 옮겨 커밋한다(중복 게시 방지)
        if: always() && github.event.schedule != '17 13 * * 1' && github.event.inputs.mode != 'ping' && github.event.inputs.mode != 'check'
        run: |
          git add -A threads
          if git diff --cached --quiet; then echo "옮긴 글 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Threads 게시 기록 $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::게시 기록 커밋을 올리지 못함"; exit 1

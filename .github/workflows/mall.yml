# 김박사 몰(2026-11-19 운영자 "블로거 말고 제대로된 쇼핑몰로 만들어"): 쿠팡 API로 진열을 받고(scripts/mall_build.py) Cloudflare 워커 정적 자산(kimworld-mall, mall/wrangler.toml)으로 올린다.
# 매일 한 번(한국 07:10) + 손으로. 진열은 mall/catalog.json에 남긴다(사이트 배포는 mall/** 를 건너뛴다).
# 사용자 지정 도메인 mall.drkimworld.com 은 토큰 권한이 되면 붙인다(안 되면 pages.dev 주소 그대로, 주석에 이유).
name: Kimdr mall

on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      fetch:
        description: "0이면 쿠팡 API를 부르지 않고 저장된 진열로만 다시 올림"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: kimdr-mall
  cancel-in-progress: false

jobs:
  mall:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Fetch and build
        run: |
          pip install -q pyyaml
          if [ "${{ inputs.fetch }}" = "0" ]; then python3 scripts/mall_build.py --build dist-mall; else python3 scripts/mall_build.py --fetch --build dist-mall; fi
      - name: Deploy (Cloudflare Workers static assets)
        # Pages 권한이 없어(11-19) 워커 정적 자산으로 올린다. 404 화면은 홈 복사본
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=김박사 몰::Cloudflare 비밀값 없음"; exit 1; }
          cp dist-mall/index.html dist-mall/404.html
          cd mall && npx --yes wrangler@3.99.0 deploy 2>&1 | tail -8 | tee ../.deploy.txt
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' ../.deploy.txt | head -1)
          [ -n "$URL" ] || { echo "::error title=김박사 몰 배포::$(tail -3 ../.deploy.txt | tr '\n' ' ' | head -c 300)"; exit 1; }
          echo "::notice title=김박사 몰 배포::$URL"
      - name: Custom domain (best effort)
        # mall.drkimworld.com 을 워커 사용자 지정 도메인으로(영역 권한이 있으면). 실패해도 workers.dev 주소로 운영
        continue-on-error: true
        run: |
          D=$(python3 -c "import yaml;print(yaml.safe_load(open('mall/mall.yaml')).get('custom_domain') or '')")
          [ -n "$D" ] || exit 0
          cd mall && cp wrangler.toml wrangler.cd.toml && printf '\n[[routes]]\npattern = "%s"\ncustom_domain = true\n' "$D" >> wrangler.cd.toml
          npx --yes wrangler@3.99.0 deploy -c wrangler.cd.toml 2>&1 | tail -6 > ../.cd.txt || true
          if grep -q "$D" ../.cd.txt && ! grep -qi "error" ../.cd.txt; then echo "::notice title=김박사 몰 도메인::https://$D 연결"; else echo "::notice title=김박사 몰 도메인::못 붙임 — $(grep -i error ../.cd.txt | head -1 | head -c 200)"; fi
      - name: IndexNow (search engines)
        # 2026-11-20 몰 검색 유입: 배포 뒤 몰 주소(사이트맵 전부)를 빙·네이버 IndexNow에 알린다. 실패해도 배포와 무관
        continue-on-error: true
        run: python3 scripts/indexnow.py mall dist-mall/sitemap.xml
      - name: Commit catalog
        # 2026-11-22: 예약 실행에선 inputs.fetch가 null이고 GitHub 식에서 null == '0'(둘 다 숫자 0)이라 이 단계가 늘 건너뛰어졌다(진열 11-20 이후 저장 안 됨)
        if: always() && (github.event_name == 'schedule' || inputs.fetch != '0')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mall/catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "김박사 몰 진열 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1

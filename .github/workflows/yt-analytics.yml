# 유튜브 분석 숫자(일별 조회·구독·시청 시간, 최근 14일 영상별)를 비공개 ops-data stats/youtube/ 에 쌓는다 — scripts/yt_analytics.py.
# 2026-11-22: vidIQ 크레딧이 떨어져 구독 1,000회당을 못 읽게 돼서, 11-20 넣은 분석 권한으로 직접 읽는다(읽기만, 공개 콘텐츠는 바꾸지 않음).
# 매일 태평양 자정 뒤(쿼터 새로 찬 뒤) 한 번. 공개 주석에는 줄 수만.
name: YouTube analytics (private)

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/yt_analytics.py .cache/yt
      - name: Publish (private)
        env:
          OPS_PUSH_TOKEN: ${{ secrets.OPS_PUSH_TOKEN }}
        run: |
          [ -f .cache/yt/analytics.json ] || exit 0
          scripts/ops_publish.sh .cache/yt/analytics.json youtube/analytics.json
          scripts/ops_publish.sh .cache/yt/summary.md youtube/summary.md

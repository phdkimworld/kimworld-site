# 인스타 계정을 휴대폰만으로 연결(2026-11-26 운영자 "폰으론 못해?") — scripts/ig_connect.py
# 1) 휴대폰에서 Instagram 승인 주소를 열어 해당 계정으로 '허용'
# 2) 넘어간 drkimworld.com 주소의 ?code= 값(또는 주소 전체)을 이 워크플로 code 입력에 넣고 실행(1시간·1회용)
# 토큰은 출력하지 않고 바로 비밀값 <prefix>_ACCESS_TOKEN·<prefix>_USER_ID 에 넣는다. 60일 갱신은 token-refresh.yml.
name: Instagram connect
# 2026-11-27: 휴대폰 폼이 길어 실행 버튼이 안 보여 입력을 code + target(선택) 두 칸으로 줄임. target=threads-drkimworld 로 Threads 계정도(예 @drkimworld → DRKIM_THREADS_ACCESS_TOKEN). 앱 비밀은 THREADS_APP_SECRET

on:
  workflow_dispatch:
    inputs:
      code:
        description: "승인 뒤 넘어간 주소 전체"
        required: true
      target:
        description: "연결할 계정"
        type: choice
        default: threads-drkimworld
        options: [threads-drkimworld, instagram-drkim_world, threads-phdkimworld, instagram-drkimworld]

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet "pynacl==1.5.0"
      - name: Exchange and store
        env:
          CODE: ${{ inputs.code }}
          TARGET: ${{ inputs.target }}
          TH_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          IGA_SECRET: ${{ secrets.HEALTH_IG_APP_SECRET }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          echo "::add-mask::$CODE"
          # 2026-11-27: 본계정 Threads @phdkimworld(THREADS_*)·인스타 @drkimworld(IG_*)도 code 190 으로 끊겨 같은 통로로 다시 연결
          case "$TARGET" in
            threads-drkimworld)    export PLATFORM=threads   EXPECT=drkimworld   PREFIX=DRKIM_THREADS IG_APP_SECRET="$TH_SECRET" ;;
            threads-phdkimworld)   export PLATFORM=threads   EXPECT=phdkimworld  PREFIX=THREADS       IG_APP_SECRET="$TH_SECRET" ;;
            instagram-drkim_world) export PLATFORM=instagram EXPECT=drkim_world  PREFIX=HEALTH_IG     IG_APP_SECRET="$IGA_SECRET" ;;
            instagram-drkimworld)  export PLATFORM=instagram EXPECT=drkimworld   PREFIX=IG            IG_APP_SECRET="$IGA_SECRET" ;;
            *) echo "::error::알 수 없는 target $TARGET"; exit 1 ;;
          esac
          python3 scripts/ig_connect.py

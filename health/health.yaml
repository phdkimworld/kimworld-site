# 김박사 건강몰 — 영양제 중심 별도 사이트(운영자 지시 2026-11-19 ET "김박사 건강몰이란걸 하나 만들어서 영양제 위주로 채워줘
# 여기에 나중에 퍼널들을 붙일거고. 일단 검색노출 할수 있으면 해주고. 내 도메인안에 서브로 안 겹치게 새로 하나 만들어").
#
# 김박사 몰(mall.drkimworld.com, 장보기 입구)과 겹치지 않게: 이곳은 '성분 가이드(검색 유입) → 쿠팡 검색 결과' 구조다.
#  - 성분 가이드 페이지가 본문(식약처 인정 기능성 문구·하루 섭취량·섭취 시 주의사항·고르는 법). 검색 노출의 중심.
#  - 상품은 쿠팡 파트너스 API(검색 search · 헬스/건강식품 베스트 bestcategories/1024)에서 이름·가격만. 효능 문구를 상품 옆에 붙이지 않는다.
#  - scripts/health_build.py 가 만들고 .github/workflows/health.yml 이 Cloudflare 워커 정적 자산(kimworld-health)으로 올린다.
#
# 법 기준(식품표시광고법 제8조, 공정위 추천·보증 심사지침):
#  - 기능성은 식약처 인정 문구 그대로만(functions). 질병 예방·치료, 의약품 오인, 다른 제품 비방 표현 금지 — 빌드가 banned 낱말을 검사한다.
#  - 상품 이름에 질병·의약품 낱말이 있으면 진열에서 뺀다(drop_words).
#  - 모든 페이지 위·아래 대가성 문구, 모든 쿠팡 링크 rel="sponsored nofollow noopener".
#  - 주의사항·수치를 새로 넣으면 sources에 확인한 주소를, verified에 날짜를 적는다. 확인 못 한 수치는 넣지 않는다.
#
# 추적: 쿠팡 하위 ID 접두어 hm…(성분별 hm<코드>, 베스트 hmbest) → 비공개 by_sub, ops_digest '김박사 건강몰' 줄.
# 퍼널: funnels.<자리> 에 {title, text, url, button} 를 넣으면 그 자리에 상자가 켜진다(비우면 없음). 자리: home, guide(모든 가이드 아래), guide-<slug>(그 가이드만).
name: "김박사 건강몰"
tagline: "영양제, 고르기 전에 확인할 것만"
url: "https://health.drkimworld.com"
custom_domain: health.drkimworld.com
best_category: 1024          # 쿠팡 '헬스/건강식품'(2026-11-20 실제 응답은 신선식품이 섞여 옴 — 성분 이름(match)이 든 상품만 남긴다)
best_subid: hmbest
per_search: 10            # 쿠팡 검색 API 한 번 최대 10개
keep_items: 24            # 성분별로 쌓아 두는 상품 수(새로 찾은 것이 앞)
keep_days: 14             # 이 기간 동안 검색에 다시 안 잡힌 상품은 뺀다
searches_per_run: 3          # 2시간마다 실행(health.yml) → 하루 36회 검색. 손 실행 때 searches 입력으로 늘릴 수 있음(2026-11-20 운영자 '주요 영양제 상품 채워놔'). 쿠팡 검색 API는 시간당 10회 — 사이트 배포(coupang_sync)가 시간당 8회까지 쓰므로 여기서는 2회만
indexnow_key: "7a1d6437e712e2a606dfc68baf33f33d"   # IndexNow 공개 키(빙·네이버·얀덱스에 새 주소 알림). 같은 이름의 .txt를 사이트 맨 위에 둔다
verification:                # 서치 콘솔·서치어드바이저에서 이 사이트(health.drkimworld.com)를 등록하고 받은 HTML 태그 값(공개값)
  google: "MkduUezdSLhoQCWYmilJ2kwYezMuNcJ7YkqMRGiv0rI"   # 건강월드 계정, 2026-11-20 사이트 확인 API로 받음
  naver: ""
  bing: "85D43DC5017A2FA2EB2D2711C5B8B4AD"
  daum: ""                   # 다음 웹마스터도구 PIN 인증값 → robots.txt 에 #DaumWebMasterTool: 줄로 들어감
# 상품 이름에 그 가이드의 match 낱말이 하나도 없으면 진열하지 않는다(검색 결과 앞쪽에 무관한 상품이 섞여 옴, 2026-11-20 확인)
# 애드센스(2026-11-20 운영자 "애드센스도 등록해"): 사이트 승인은 최상위 도메인(drkimworld.com) 단위 — 하위 주소는 따로 신청하지 않고
# 본 도메인 승인 때 함께 열린다. 지금은 계정 코드(head)와 ads.txt만. 광고 단위 번호(slot)를 넣으면 가이드 본문 중간에 한 개 나온다.
# 본 사이트 재신청 규칙(미디어 skill/runbooks/ads_access.md 4장)을 따른다: 자동 광고 끔, noindex 페이지(/best/·404)에는 넣지 않음.

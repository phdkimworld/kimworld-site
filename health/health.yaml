guides:
  - slug: omega3
    name: "오메가3"
    aka: "EPA 및 DHA 함유 유지"
    keyword: "오메가3"
    keywords: ["오메가3", "rTG 오메가3", "알티지 오메가3", "EPA DHA 오메가3"]
    match: ["오메가3", "오메가 3", "오메가-3", "rTG", "EPA", "DHA", "omega"]
    sub: hmomega
    intro: "오메가3는 건강기능식품 공전에서 'EPA 및 DHA 함유 유지'라는 이름으로 관리됩니다. 기능성마다 필요한 하루 섭취량이 달라서, 앞면 숫자보다 뒷면의 EPA와 DHA 합을 먼저 봐야 합니다."
    functions:
      - {text: "혈중 중성지질 개선·혈행 개선에 도움을 줄 수 있음", dose: "EPA와 DHA의 합으로서 0.5~2g"}
      - {text: "건조한 눈을 개선하여 눈 건강에 도움을 줄 수 있음", dose: "EPA와 DHA의 합으로서 0.6~2.24g"}
      - {text: "기억력 개선에 도움을 줄 수 있음", dose: "EPA와 DHA의 합으로서 0.9~2g"}
    cautions:
      - "개인에 따라 피부 관련 이상반응이 발생할 수 있음"
      - "의약품(항응고제, 항혈소판제, 혈압강하제 등) 복용 시 전문가와 상담할 것"
      - "이상사례 발생 시 섭취를 중단하고 전문가와 상담할 것"
    choose:
      - "앞면의 1,000mg은 캡슐 하나의 무게일 수 있습니다. 영양·기능정보 표에서 1일 섭취량당 'EPA와 DHA의 합'을 확인하세요."
      - "원하는 기능성의 하루 섭취량 범위(위 표)에 들어가는지 보세요. 눈 건강·기억력 기능성은 혈행보다 필요한 양이 많습니다."
      - "제품에 '건강기능식품' 표시와 기능성 문구가 있는지 확인하세요."
    sources:
      - {title: "식약처 카드뉴스 「건강기능식품 이야기」 (기능성·일일섭취량)", url: "https://mfds.go.kr/brd/m_768/view.do?seq=3693"}
      - {title: "식약처 카드뉴스 「건강기능식품 이야기 2호」 (섭취 시 주의사항)", url: "https://www.mfds.go.kr/brd/m_768/view.do?page=1&seq=3677"}
    verified: "2026-11-19"

  - slug: lutein
    name: "루테인"
    aka: "마리골드꽃추출물"
    keyword: "루테인"
    keywords: ["루테인", "마리골드꽃추출물 루테인", "루테인 지아잔틴"]
    match: ["루테인", "마리골드", "lutein"]
    sub: hmlutein
    intro: "루테인은 2023년부터 원료 이름이 '마리골드꽃추출물'로 바뀌었습니다. 원료 전체 무게와 루테인 함량은 다른 숫자이니, 표시된 루테인 양을 확인해야 합니다."
    functions:
      - {text: "노화로 인해 감소될 수 있는 황반색소밀도를 유지하여 눈 건강에 도움을 줄 수 있음", dose: "루테인으로서 10~20mg"}
    cautions:
      - "흡연자는 섭취에 주의하라는 내용이 2023년 섭취 시 주의사항에 추가되었습니다(식약처 국내 코호트 연구 근거)."
      - "제품 표시사항의 섭취 시 주의사항을 함께 확인하세요."
    choose:
      - "'마리골드꽃추출물 ○○mg'은 원료 무게일 수 있습니다. 1일 섭취량당 '루테인' 함량을 보세요."
      - "담배를 피우신다면 구매 전에 의사·약사와 먼저 상담하세요."
      - "제품에 '건강기능식품' 표시가 있는지 확인하세요."
    sources:
      - {title: "뉴시스: 식약처, 루테인 원료 명칭 개정·흡연자 주의사항 추가 (2023-12-08)", url: "https://www.newsis.com/view/NISX20231207_0002550447"}
      - {title: "데일리팜: 건기식협회 눈 건강 원료 소개 (루테인 일일섭취량)", url: "https://www.dailypharm.com/user/news/68922"}
    verified: "2026-11-19"

  - slug: milk-thistle
    name: "밀크씨슬"
    aka: "밀크씨슬(카르두스 마리아누스) 추출물"
    keyword: "밀크씨슬"
    keywords: ["밀크씨슬", "실리마린 밀크씨슬", "밀크씨슬 간"]
    match: ["밀크씨슬", "밀크시슬", "실리마린", "milk thistle"]
    sub: hmmilk
    intro: "밀크씨슬은 지표성분 '실리마린' 함량으로 기능성이 정해집니다. 원료 무게가 아니라 1일 섭취량당 실리마린 양을 보는 것이 핵심입니다."
    functions:
      - {text: "간 건강에 도움을 줄 수 있음", dose: "실리마린으로서 130mg"}
    cautions:
      - "알레르기 반응이 나타나는 경우에는 섭취를 중단할 것"
      - "질환이 있거나 의약품을 복용 중이라면 전문가와 먼저 상담하세요."
    choose:
      - "1일 섭취량당 실리마린이 130mg인지 확인하세요."
      - "국화과 식물에 알레르기가 있었다면 섭취 전에 상담하세요."
      - "제품에 '건강기능식품' 표시가 있는지 확인하세요."
    sources:
      - {title: "KB 알고 먹자 영양제 ⑧ 밀크씨슬 (식약처 기능성·실리마린 130mg)", url: "https://kbthink.com/main/living-finance/life-health/kb-golden-life-health-231205.html"}
    verified: "2026-11-19"

  - slug: coq10
    name: "코엔자임Q10"
    aka: "코큐텐"
    keyword: "코엔자임Q10"
    keywords: ["코엔자임Q10", "코큐텐", "코엔자임Q10 100mg"]
    match: ["코엔자임", "코큐텐", "CoQ10", "coq10"]
    sub: hmcoq10
    intro: "코엔자임Q10은 2010년 고시형 원료가 되었고, 2022년 재평가를 거쳤습니다. 기능성을 위한 하루 섭취량 범위가 좁은 편이라 함량을 꼭 확인해야 합니다."
    functions:
      - {text: "항산화·높은 혈압 감소에 도움을 줄 수 있음", dose: "코엔자임Q10으로서 90~100mg"}
    cautions:
      - "2023년 재평가로 코엔자임Q10 등 9종의 섭취 시 주의사항이 추가·변경되었습니다. 제품 표시사항의 주의사항을 반드시 확인하세요."
      - "의약품을 복용 중이라면 전문가와 먼저 상담하세요."
    choose:
      - "1일 섭취량당 코엔자임Q10이 90~100mg인지 보세요."
      - "혈압약 등 의약품을 대신하는 제품이 아닙니다. 복용 중인 약은 임의로 바꾸지 마세요."
      - "제품에 '건강기능식품' 표시가 있는지 확인하세요."

# 시청자 프로필(운영자 2026-11-24 "컨텐츠별로 타겟 독자층 프로필을 링크에 태그해서 프로필별로 방문 및 구매전환을 추적… 몰 내에도 프로필에 근거한 체류시간 극대화·추가 전환").
# 프로필 = 그 영상이 겨냥한 관심 분야(사람 정보 아님). 영상 링크에 aud=<code>(없으면 utm_campaign 의 영상 slug → profile_map).
# 화면: 가이드 위쪽에 '프로필 상자'(확인 순서 3단계·match '이런 분 → 이런 조건의 제품' 표·1분 자가 점검·같은 관심의 다음 가이드)
# 운영자 2026-11-24 "모든 컨텐츠의 핵심은 수요와 공급을 연결": match 는 어떤 조건·상황의 사람(who) → 어떤 조건·특성의 제품(pick). 가이드 choose·기능성 기준에서만 쓴다, 진열에 정렬·거르기 버튼. 상품 옆에는 질병 문장을 두지 않는다.
# 쿠팡 하위 ID: 프로필이 있으면 클릭 순간 hm<성분> 뒤에 p<code>를 붙인다(hmomegapblood) → 프로필별 주문까지. who 는 제작용 메모(화면에 안 나옴).
# 새 영상을 만들면 profile_map 에 slug 를 꼭 넣는다(healthworld-ops tools/hw_aud.py 가 확인).
profiles:
  - code: blood
    name: "혈행·혈관 건강"
    who: "40~60대, 건강검진에서 혈압·중성지방 수치를 들은 사람. 약을 이미 먹는 경우가 많아 약-영양소 상담 문구가 핵심. 뒷면 숫자·1알당 값 비교에 반응"
    guides: [omega3, coq10, magnesium]
    food: "등푸른 생선"
    match:
      - {who: "의약품을 드시는 분", pick: "섭취 시 주의사항을 보고 의사·약사와 상담한 뒤 고르기"}
      - {who: "생선을 거의 안 드시는 분", pick: "1일 섭취량당 EPA와 DHA 합이 0.5~2g인 오메가3"}
      - {who: "코엔자임Q10을 찾는 분", pick: "1일 섭취량당 코엔자임Q10 90~100mg"}
    steps:
      - "건강검진 수치와 지금 드시는 약 이름을 먼저 적어 두세요. 약을 드신다면 섭취 시 주의사항을 보고 의사·약사와 상담하세요."
      - "음식으로 들어오는 양부터 보세요. 등푸른 생선을 주 2회 이상 드시는지 확인하세요."
      - "보충한다면 뒷면의 1일 섭취량이 아래 식약처 기준 범위 안인지, 1알당 값은 얼마인지 비교하세요."
  - code: eye
    name: "눈 건강"
    who: "화면을 오래 보는 30~50대와 황반이 걱정되는 50대 이상. 건조함·피로가 출발점. 루테인·오메가3 함량 숫자 구분이 관심사"
    guides: [lutein, omega3]
    food: "녹황색 채소·등푸른 생선"
    match:
      - {who: "앞면 숫자로 루테인을 고르던 분", pick: "1일 섭취량당 '루테인' 10~20mg이 적힌 제품(원료 무게 아님)"}
      - {who: "건조한 눈 때문에 오메가3를 찾는 분", pick: "EPA와 DHA 합 0.6~2.24g(건조한 눈 기능성 기준)"}
      - {who: "담배를 피우는 분", pick: "루테인 구매 전에 의사·약사와 먼저 상담"}
    steps:
      - "불편이 오래 가면 안과 진료가 먼저입니다. 원인(화면·렌즈·나이)을 먼저 짚어 보세요."
      - "녹황색 채소와 등푸른 생선으로 들어오는 양을 확인하세요."
      - "보충한다면 원료 무게가 아니라 루테인 또는 EPA·DHA 함량이 식약처 기준 범위인지 보세요."
  - code: energy
    name: "피로·활력"
    who: "늘 피곤한 30~50대, 특히 여성(철·비타민C 짝 영양소)과 바쁜 직장인. 원인 찾기(수면·식사·철분)에 반응"
    guides: [red-ginseng, vitamin-c, magnesium]
    food: "고기·생선·채소"
    match:
      - {who: "홍삼을 고르는 분", pick: "1포(1일 섭취량)당 진세노사이드 함량을 비교, '건강기능식품' 표시 확인"}
      - {who: "채소·곡물 위주로 드시는 분", pick: "식사에 곁들일 비타민C(1일 30~1,000mg 범위)"}
      - {who: "마그네슘 흡수를 따지는 분", pick: "원소량 94.5~250mg, 구연산·킬레이트 같은 형태 표시 확인"}
    steps:
      - "피로가 오래 가면 진료로 원인(빈혈·갑상선·수면)을 먼저 확인하세요."
      - "끼니와 잠부터 보세요. 고기·생선·채소로 들어오는 양이 충분한지 확인하세요."
      - "보충한다면 기능성 원료의 1일 섭취량이 식약처 기준 범위인지, 짝 영양소가 겹치지 않는지 보세요."
  - code: bone
    name: "뼈 건강"
    who: "50대 이상, 특히 폐경 이후 여성과 실내 생활이 긴 사람. 비타민D 단위(IU·%)와 칼슘·마그네슘 짝이 관심사"
    guides: [vitamin-d, magnesium]
    food: "생선·달걀·유제품"
    match:
      - {who: "종합비타민을 이미 드시는 분", pick: "비타민D가 겹치지 않는지 합쳐서 확인"}
      - {who: "단위가 헷갈리는 분", pick: "1일 섭취량당 µg과 기준치 대비 %를 하나로 맞춰 비교"}

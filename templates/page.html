{% extends "base.html" %}
{% block title %}{{ p.title }} | {{ site.site_name }}{% endblock %}
{% block description %}{{ p.description or site.description }}{% endblock %}
{% block main %}
<div class="wrap narrow">
  <header class="page-head"><h1>{{ p.title }}</h1>{% if p.updated %}<p class="muted">최종 수정 {{ p.updated|kdate }}</p>{% endif %}</header>
  <div class="prose">{{ p.html|safe }}</div>
</div>
{% endblock %}

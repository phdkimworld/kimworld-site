<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 브랜드 엔드카드(2026-11-22 운영자 "아웃트로 영상도 넣어서 홍보장으로 활용"). 롱폼 outro 슬라이드 자리에 뜬다(나레이션 outro 문단은 그대로).
     지침 A10: 글자는 왼쪽 열(x 96~900)에만. 오른쪽(x 1000 이상)은 유튜브 최종 화면 요소(다음 영상·구독) 자리로 비운다.
     render(data) 뒤 at(t)로 0.7초 등장 움직임(워드마크는 0초부터 그대로, 홍보 칸이 차례로 들어옴) -->
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:'Noto Sans CJK KR',sans-serif;word-break:keep-all;color:#E6EDF5;
 background:radial-gradient(900px 700px at 10% 8%,rgba(245,184,61,.13),transparent 70%),radial-gradient(1100px 900px at 78% 55%,rgba(79,163,255,.07),transparent 70%),#0B1524}
#L{position:absolute;left:96px;top:78px;width:804px}
#wm{font-size:112px;font-weight:900;color:#F5B83D;letter-spacing:-3px;line-height:1.1}
#bar{margin-top:18px;width:300px;height:7px;border-radius:4px;background:#F5B83D}
#idl{margin-top:22px;font-size:44px;font-weight:700;color:#E6EDF5;letter-spacing:-.5px}
.card{position:relative;margin-top:30px;padding:26px 34px 24px 40px;border-radius:26px;background:rgba(22,37,59,.94);border:2px solid #22385A;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card:before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:8px;border-radius:0 6px 6px 0;background:var(--c)}
.tag{display:inline-block;padding:4px 20px;border-radius:999px;background:var(--c);color:#0E1A2B;font-size:30px;font-weight:900}
.ti{margin-top:12px;font-size:56px;font-weight:900;color:#fff;line-height:1.2;letter-spacing:-1px}
.sb{margin-top:6px;font-size:36px;font-weight:700;color:#C9D6E6;line-height:1.3}
.url{margin-top:10px;font-size:36px;font-weight:900;color:var(--c);letter-spacing:.2px}
.nt{position:absolute;right:28px;top:26px;font-size:24px;color:#8FA3BC;font-weight:700}
#ftr{position:absolute;left:96px;bottom:40px;font-size:22px;color:#6F829B}
</style></head><body>
<div id="L"><div id="wm">김박사 월드</div><div id="bar"></div><div id="idl"></div><div id="cards"></div></div>
<div id="ftr">교육용 분석 · 매수·매도 권유 아님</div>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(d){
  document.getElementById('idl').textContent=d.identity||'';
  document.getElementById('cards').innerHTML=(d.cards||[]).map(c=>`<div class="card" style="--c:${c.color||'#F5B83D'}"><span class="tag">${esc(c.tag)}</span>${c.note?`<span class="nt">${esc(c.note)}</span>`:''}`+
    `<div class="ti">${esc(c.title)}</div>${c.sub?`<div class="sb">${esc(c.sub)}</div>`:''}${c.url?`<div class="url">${esc(c.url)}</div>`:''}</div>`).join('');
}
// 측정: 왼쪽 열 바닥과 글자 넘침(잘림 검사용)
function measure(){const r=document.getElementById('L').getBoundingClientRect();
  const over=[...document.querySelectorAll('.ti,.sb,.url,.tag,#idl')].filter(e=>e.scrollWidth>e.clientWidth+2||e.getBoundingClientRect().right>900).map(e=>e.textContent);
  const lines=[...document.querySelectorAll('.ti,.sb,.url')].filter(e=>e.getBoundingClientRect().height>parseFloat(getComputedStyle(e).lineHeight||0)*1.6).map(e=>e.textContent);
  return {bottom:r.bottom,right:r.right,over,lines}}
const eo=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
function at(t){
  document.getElementById('bar').style.width=(120+180*eo(t/0.4)).toFixed(1)+'px';
  [...document.querySelectorAll('.card')].forEach((c,i)=>{const k=eo((t-0.12-0.2*i)/0.4);c.style.opacity=k.toFixed(3);c.style.transform=`translateX(${(-60*(1-k)).toFixed(1)}px)`});
}
</script></body></html>

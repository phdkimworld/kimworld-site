<!doctype html><html><head><meta charset="utf-8">
<!-- anim 틀 compare_bars: 두 숫자(또는 2~7개) 맞대기 — 가로 막대가 차례로 자라고 끝에 숫자가 붙는다. 리포트 그림 figkit 'compare'와 같은 입력.
     data = {title, sub?, kicker?, unit?('%'|'달러'|''), decimals?(1), items:[{label, sub?, value, text?, hi?}](2~7),
             callout?(끝에 뜨는 한 줄, 예: '차이 3.3배'), callout_beat?, note?, source?, beats?:[문장 번호…](items[1:]마다)}
     첫 프레임: 제목·모든 이름(흐리게)·첫 막대와 첫 숫자. 같은 부호면 크기 막대(0에서 오른쪽), 부호가 섞이면 0 기준선 양쪽.
     계약: window.scene = {dur, ready, seek(t), beats} — kit.js -->
<link rel="stylesheet" href="lib/kit.css"><script src="lib/gsap-3.12.5.min.js"></script><script src="lib/kit.js"></script>
</head><body><script>
frame();
const I = d.items || [], n = I.length, vals = I.map(x => x.value || 0);
const mixed = Math.min(...vals) < 0 && Math.max(...vals) > 0, M = mixed ? Math.max(...vals.map(Math.abs)) : Math.max(...vals.map(Math.abs)) || 1;
const TOP = d.sub ? 300 : 270, bot = d.callout ? 860 : 950, rowH = Math.min(175, (bot - TOP) / n), bh = Math.min(70, rowH * .46);
const LX = 96, BX0 = 700, VX = 1824, VF = n <= 3 ? 64 : 52;
// 숫자 칸 폭: 가장 긴 숫자 글자에 맞춰 막대 끝(BX1)을 정한다(긴 금액 '약 77억 1,000만 달러'가 막대와 겹치지 않게)
const _m = el('text', {'font-size': VF, 'font-weight': 900}), VW = Math.max(...I.map(it => { _m.textContent = fmtv(it.value, undefined, undefined, it.text); return _m.getBBox().width; })); _m.remove();
const BX1 = Math.max(BX0 + 360, VX - VW - 40);
const lo = mixed ? Math.min(...vals) : 0, hi = mixed ? Math.max(...vals) : M, X = v => mixed ? BX0 + (v - lo) / (hi - lo) * (BX1 - BX0) : BX0 + Math.abs(v) / M * (BX1 - BX0), X0 = mixed ? X(0) : BX0;
el('line', {x1: X0, x2: X0, y1: TOP - 10, y2: TOP + rowH * n - 10, stroke: COL.mute, 'stroke-width': 3, opacity: .6});
const fs = n <= 3 ? 46 : (n <= 5 ? 40 : 36), R = [];
I.forEach((it, i) => {
  const cy = TOP + rowH * i + rowH / 2 - 10, g = el('g', {}), c = it.hi ? COL.gold : COL.bar;
  const lab = el('text', {x: LX, y: cy + (it.sub ? -4 : fs * .36), 'font-size': fs, 'font-weight': 900, fill: it.hi ? COL.gold : COL.white, 'data-box': ''}, g, it.label);
  let sub = null; if (it.sub) sub = el('text', {x: LX + 2, y: cy + 38, 'font-size': 28, 'font-weight': 700, fill: COL.mute, 'data-box': ''}, g, it.sub);
  const w = Math.abs(X(it.value || 0) - X0), x = (it.value || 0) < 0 && mixed ? X0 - w : X0;
  const bar = el('rect', {x: (it.value || 0) < 0 && mixed ? X0 : X0, y: cy - bh / 2, width: 0, height: bh, rx: 10, fill: c, opacity: it.hi ? 1 : .9}, g);
  if (it.hi) bar.setAttribute('filter', 'drop-shadow(0 0 14px rgba(245,184,61,.55))');
  const val = el('text', {x: VX, y: cy + 18, 'text-anchor': 'end', 'font-size': VF, 'font-weight': 900, fill: signCol(it.value, it.hi), 'data-box': ''}, g, fmtv(it.value, undefined, undefined, it.text));
  // 라벨 폭 넘침 줄이기(이름 칸 BX0-40까지)
  [lab, sub].forEach(t => { if (t) { const bw = t.getBBox().width, lim = BX0 - 40 - LX; if (bw > lim) t.setAttribute('font-size', +t.getAttribute('font-size') * lim / bw); } });
  R.push({g, lab, sub, bar, val, x, w});
});
let call = null; if (d.callout) call = el('text', {x: 960, y: 960, 'text-anchor': 'middle', 'font-size': 52, 'font-weight': 900, fill: COL.gold, 'data-box': ''}, null, d.callout);
const at = times(n, 1.2, 1.3), tl = gsap.timeline({paused: true});
R.forEach((r, i) => {
  if (i == 0) { r.bar.setAttribute('x', r.x); r.bar.setAttribute('width', r.w); return; }
  tl.set([r.lab, r.sub].filter(Boolean), {opacity: .4}, 0);
  tl.set(r.val, {opacity: 0}, 0);
  tl.to([r.lab, r.sub].filter(Boolean), {opacity: 1, duration: .25}, at[i]);
  tl.fromTo(r.bar, {attr: {x: X0, width: 0}}, {attr: {x: r.x, width: r.w}, duration: .65, ease: 'power2.out', immediateRender: false}, at[i]);
  tl.fromTo(r.val, {opacity: 0, scale: .85, transformOrigin: '100% 50%'}, {opacity: 1, scale: 1, duration: .3, ease: 'back.out(2)', immediateRender: false}, at[i] + .5);
});
let end = at[n - 1] + 1.2;
const hiR = R.filter((r, i) => I[i].hi);
if (hiR.length) tl.fromTo(hiR.map(r => r.val), {scale: 1}, {scale: 1.1, duration: .25, yoyo: true, repeat: 1, transformOrigin: '100% 50%', immediateRender: false}, at[n - 1] + .7);
if (call) { const tb = beatAt('callout_beat', at[n - 1] + .6); tl.set(call, {opacity: 0}, 0).fromTo(call, {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: .45, immediateRender: false}, tb); end = Math.max(end, tb + 1.0); }
finish(tl, end, at.slice(1).concat(call ? [beatAt('callout_beat', at[n - 1] + .6)] : []));
</script></body></html>

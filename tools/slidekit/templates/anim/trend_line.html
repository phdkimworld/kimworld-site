<!doctype html><html><head><meta charset="utf-8">
<!-- anim 틀 trend_line: 현금·매출·주식 수 같은 분기 추이 — 점이 하나씩 이어지며 그 분기 값이 붙는다. figkit 'trend'와 같은 입력.
     data = {title, sub?, kicker?, unit?('달러'|''), decimals?, items:[{label('2025.3분기'), value, text?('1억 2,050만'), hi?}](2~8),
             ref?:{v, label}(점선 기준), note?, source?, beats?:[문장 번호…](items[1:]마다)}
     첫 프레임: 제목·축·첫 점과 첫 값·모든 분기 이름(흐리게). -->
<link rel="stylesheet" href="lib/kit.css"><script src="lib/gsap-3.12.5.min.js"></script><script src="lib/kit.js"></script>
</head><body><script>
frame();
const I = d.items || [], n = I.length, vs = I.map(x => x.value).concat(d.ref ? [d.ref.v] : []);
let lo = Math.min(...vs), hi = Math.max(...vs); const pad = (hi - lo) * .18 || Math.abs(hi) * .1 || 1; lo -= pad; hi += pad * 1.4; if (Math.min(...vs) >= 0 && lo < 0) lo = 0;
const XL = 220, XR = 1700, Y0 = 860, Y1 = d.sub ? 360 : 330, X = i => XL + i * (XR - XL) / Math.max(1, n - 1), Y = v => Y0 - (v - lo) / (hi - lo) * (Y0 - Y1);
el('line', {x1: XL - 60, x2: XR + 60, y1: Y0 + 20, y2: Y0 + 20, stroke: COL.line, 'stroke-width': 3});
if (d.ref) { el('line', {x1: XL - 60, x2: XR + 60, y1: Y(d.ref.v), y2: Y(d.ref.v), stroke: COL.gold, 'stroke-width': 3, 'stroke-dasharray': '14 12', opacity: .85});
  el('text', {x: XL - 60, y: Y(d.ref.v) + 42, 'font-size': 30, 'font-weight': 700, fill: COL.gold, 'data-box': ''}, null, d.ref.label || ''); }
const pts = I.map((it, i) => [X(i), Y(it.value)]), up = I[n - 1].value >= I[0].value, LC = up ? COL.green : COL.red;
const line = el('path', {d: 'M' + pts.map(p => p.join(',')).join(' L'), fill: 'none', stroke: LC, 'stroke-width': 9, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'});
const len = line.getTotalLength(); line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
let acc = [0]; for (let i = 1; i < n; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); const FR = acc.map(a => a / (acc[n - 1] || 1));
const R = I.map((it, i) => {
  const [x, y] = pts[i], g = el('g', {}), c = it.hi ? COL.gold : (i == 0 ? COL.mute : LC);
  const lab = el('text', {x, y: 940, 'text-anchor': 'middle', 'font-size': n <= 5 ? 36 : 30, 'font-weight': 900, fill: i == n - 1 || it.hi ? COL.white : COL.mute, 'data-box': ''}, null, it.label);
  el('circle', {cx: x, cy: y, r: 28, fill: c, opacity: .25}, g); el('circle', {cx: x, cy: y, r: 13, fill: c, stroke: '#0B1524', 'stroke-width': 5}, g);
  const below = i > 0 && it.value < I[i - 1].value && y < Y0 - 90;
  const val = el('text', {x, y: below ? y + 70 : y - 36, 'text-anchor': i == 0 ? 'start' : (i == n - 1 ? 'end' : 'middle'), 'font-size': n <= 5 ? 46 : 38, 'font-weight': 900, fill: it.hi ? COL.gold : COL.white, 'data-box': ''}, g, fmtv(it.value, undefined, undefined, it.text));
  if (i == 0) val.setAttribute('x', x - 20); if (i == n - 1) val.setAttribute('x', x + 20);
  return {g, lab};
});
const at = times(n, 1.3, 1.2), S = {p: 0}, tl = gsap.timeline({paused: true});
R.forEach((r, i) => { if (i == 0) return; tl.set(r.g, {opacity: 0}, 0).set(r.lab, {opacity: .4}, 0);
  const t0 = Math.max(at[i - 1] + .05, at[i] - Math.min(.9, (at[i] - at[i - 1]) * .8));
  tl.fromTo(S, {p: FR[i - 1]}, {p: FR[i], duration: at[i] - t0, ease: 'power1.inOut', immediateRender: false}, t0);
  tl.to(r.g, {opacity: 1, duration: .25}, at[i]).to(r.lab, {opacity: 1, duration: .25}, at[i]); });
const end = at[n - 1] + 1.2;
finish(tl, end, at.slice(1), () => { line.style.strokeDashoffset = len * (1 - S.p); line.style.visibility = S.p > 0 ? 'visible' : 'hidden'; });
</script></body></html>

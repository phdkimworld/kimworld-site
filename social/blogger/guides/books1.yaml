# 블로거 비교 글 1: 주식 공부 책(2026-11-16). 하위 ID bgbook1
title: "주식 공부 책 추천 7권 — 입문·재무제표·투자 고전·투자 심리 순서로 읽기"
title_en: "stock investing books for beginners korean guide"
subid: bgbook1
books_only: true
labels: ["주식 공부", "책 추천", "미국주식"]
intro:
  - "주식 공부를 책으로 시작하려는 분들이 가장 많이 묻는 것은 '무엇부터 읽느냐'입니다. 좋은 책이 많아도 순서가 맞지 않으면 중간에 덮게 됩니다."
  - "이 글은 처음 읽기 좋은 입문서에서 시작해 재무제표, 투자 고전, 투자 심리 순서로 7권을 묶었습니다. 각 권마다 어떤 사람에게 맞는지 한 줄씩 적었습니다."
criteria:
  - "처음이라면 사례가 많고 문장이 쉬운 책부터 읽습니다. 공식보다 이야기가 먼저 들어와야 끝까지 읽습니다."
  - "개별 종목을 직접 고르고 싶다면 재무제표 읽는 법을 다룬 책을 한 권은 꼭 읽습니다."
  - "고전은 한 번에 다 이해하려 하지 말고, 투자 경험이 쌓인 뒤 다시 읽는다고 생각합니다."
  - "같은 주제의 책을 여러 권 사기보다 단계마다 한 권씩 고릅니다."
sections:
  - heading: "1단계 · 처음 읽는 투자 이야기"
    text: "투자가 무엇이고, 개인 투자자가 어디서 기회를 찾는지 감을 잡는 단계입니다."
    items:
      - kw: "전설로 떠나는 월가의 영웅 피터 린치"
        must: "월가의영웅"
        label: "전설로 떠나는 월가의 영웅 — 피터 린치"
        note: "일상에서 보는 회사에서 투자 아이디어를 찾는 방법을 사례로 풀어 쓴 책입니다. 처음 읽는 투자서로 많이 꼽힙니다."
      - kw: "돈의 심리학 모건 하우절"
        must: "돈의심리학"
        label: "돈의 심리학 — 모건 하우절"
        note: "돈과 투자를 대하는 태도를 짧은 이야기로 다룹니다. 숫자보다 생각의 습관을 먼저 잡고 싶은 분께 맞습니다."
  - heading: "2단계 · 재무제표 읽기"
    text: "종목을 직접 고르려면 회사가 돈을 버는지, 현금이 얼마나 남았는지를 숫자로 볼 줄 알아야 합니다."
    items:
      - kw: "재무제표 모르면 주식투자 절대로 하지 마라"
        must: "재무제표모르면"
        label: "재무제표 모르면 주식투자 절대로 하지 마라 — 사경인"
        note: "재무상태표·손익계산서·현금흐름표를 투자자 눈높이에서 설명합니다. 회계를 처음 접하는 분께 맞습니다."
  - heading: "3단계 · 투자 고전"
    text: "가치투자와 성장주 투자의 기본 생각을 세운 책들입니다. 한 번에 다 이해하지 못해도 괜찮습니다."
    items:
      - kw: "현명한 투자자 벤저민 그레이엄"
        must: "현명한투자자"
        label: "현명한 투자자 — 벤저민 그레이엄"
        note: "'안전마진'이라는 생각을 처음 정리한 고전입니다. 분량이 많아 해설이 붙은 판을 고르는 분이 많습니다."
      - kw: "위대한 기업에 투자하라 필립 피셔"
        must: "위대한기업에투자하라"
        label: "위대한 기업에 투자하라 — 필립 피셔"
        note: "오래 성장할 회사를 고르는 질문들을 다룹니다. 성장주에 관심 있는 분께 맞습니다."
      - kw: "주식시장을 이기는 작은 책"
        must: "주식시장을이기는작은책"
        label: "주식시장을 이기는 작은 책 — 조엘 그린블라트"
        note: "좋은 회사를 싼값에 사는 원리를 짧고 쉽게 설명한 책입니다. 고전이 부담스러울 때 먼저 읽기 좋습니다."
  - heading: "4단계 · 시장과 트레이더의 심리"
    text: "가격이 왜 예상과 다르게 움직이는지, 시장에서 오래 살아남은 사람들은 어떻게 생각하는지 보는 단계입니다."
    items:
      - kw: "시장의 마법사들 잭 슈웨거"
        must: "시장의마법사들"
        label: "시장의 마법사들 — 잭 슈웨거"
        note: "여러 트레이더와의 인터뷰를 모은 책입니다. 같은 시장을 보는 방법이 얼마나 다른지 비교해 볼 수 있습니다."
outro:
  - "책은 한 번에 다 사기보다 지금 단계에 맞는 한 권부터 읽는 편이 끝까지 읽기 쉽습니다."
  - "책에서 배운 생각을 실제 종목에 적용해 보고 싶다면, 주가가 크게 움직인 날을 날짜별로 정리한 리포트를 함께 보면 도움이 됩니다."

# 블로거 비교 글 3: 투자 공부용 태블릿 구성(2026-11-16). 하위 ID bgtab1
title: "주식 공부용 태블릿 고르는 법 — 화면 크기·거치대·키보드까지"
title_en: "tablet for stock market study guide"
subid: bgtab1
labels: ["태블릿", "주식 공부", "투자 환경"]
intro:
  - "출퇴근길이나 소파에서 리포트와 차트를 볼 때는 휴대폰보다 태블릿이 훨씬 편합니다. 특히 긴 리포트나 공시 문서를 읽을 때 차이가 큽니다."
  - "이 글은 태블릿을 처음 고르는 분 기준으로 화면 크기, 거치대, 키보드 순서로 정리했습니다. 상품은 기준을 설명하기 위한 쿠팡 검색 상위 예시입니다."
criteria:
  - "리포트·공시를 읽는 용도면 11인치 안팎이 들고 다니기와 읽기의 균형이 좋습니다. 차트를 두 개 이상 띄우려면 12~13인치가 편합니다."
  - "증권사 앱은 대부분 안드로이드와 아이패드를 모두 지원하지만, 쓰는 증권사 앱이 태블릿 화면을 지원하는지 먼저 확인합니다."
  - "오래 볼수록 거치대가 중요합니다. 눈높이로 올리면 목과 어깨가 덜 피곤합니다."
  - "메모를 많이 한다면 블루투스 키보드를 함께 쓰면 노트북 대신으로도 쓸 수 있습니다."

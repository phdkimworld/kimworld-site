# 광고 설정 — 이 파일만 고치면 사이트 전체 광고가 바뀝니다.
# 값이 비어 있는 광고는 아무것도 출력하지 않습니다(빈 자리·자리 표시 문구 없음).
# 여기 넣는 번호(ca-pub-…, DAN-…, 쿠팡 링크)는 모두 웹페이지에 그대로 보이는 공개값입니다. 비밀 키는 넣지 않습니다.

enabled: true

adsense:
  client: "ca-pub-7488269227696808"   # ca-pub-0000000000000000  (넣으면 ads.txt도 자동 생성)
  slots:
    in_article: ""           # 인아티클 광고 단위 번호 (본문 중간)
    display: ""              # 디스플레이 광고 단위 번호 (선택)

adfit:
  # 카카오 애드핏 운영정책: 한 페이지에 카카오 광고 4개 초과 금지, 콘텐츠와 함께 광고를 계속 동적으로 불러오는 것 금지.
  # → 애드핏은 처음 받는 HTML의 고정 자리에만, 한 페이지 최대 4개(같은 단위는 한 페이지 한 번). 피드를 더 내려 불러오는 자리는 애드센스·쿠팡이 채운다.
  max_per_page: 4            # 4보다 크게 하면 빌드가 막는다
  width: 320
  height: 100
  sizes:                     # 단위별 크기 [가로, 세로]. 없으면 위 width/height
    report_mid: [300, 250]
    feed: [300, 250]
    feed2: [300, 250]
    rail: [300, 250]
  units:
    report_mid: "DAN-JnyyFywjMJcgsuJw"   # DAN-xxxx  리포트 중간(300x250). 비어 있으면 그 자리는 쿠팡 상자
    report_end: "DAN-fLqYFcTk9aoRDmDT"   # DAN-xxxx  리포트 하단(320x100)
    list: "DAN-TdWSvs3gvdNP2O1i"   # 홈·목록(320x100)
    feed: "DAN-22tVjrp1Keg7k0T4"   # 홈 피드 사이(300x250). 한 페이지에 한 번만(나머지 피드 자리는 쿠팡)
    rail: "DAN-0p5vWnTIuHoy8x0d"   # PC 오른쪽 칸(300x250). 칸이 안 보이는 휴대폰에서는 부르지 않는다
    feed2: "DAN-apcjcNPQfZouuUyV"   # 홈 피드 두 번째 광고 자리(300x250)
    bottom: "DAN-uWCPtUhxpI0zRlUk"  # 페이지 맨 아래(320x100, 종목·테마·검색·글 상세·안내 페이지). 그 페이지 애드핏이 4개 미만일 때만, 아니면 쿠팡 배너

dable:
  # 데이블(추천 콘텐츠 광고, dable.io). 승인 조건: 최근 7일 하루 평균 페이지뷰 3,000 또는 방문자 1,500, 글 100개 이상.
  # 승인되면 데이블이 주는 서비스 이름(보통 도메인)과 위젯 번호만 넣으면 모든 페이지에 로그 스크립트, 리포트 끝에 위젯이 켜진다.
  service: ""        # 예: drkimworld.com
  widgets:
    report: ""       # 리포트 본문 끝 위젯 번호(dablewidget_ 뒤의 값)

# 새 광고 네트워크가 ads.txt 줄을 요구하면 여기에 그대로 넣는다(형식 검사). 애드센스 줄은 자동
ads_txt_extra: []

coupang:
  # 쿠팡 파트너스 대시보드에서 만든 카테고리 배너 코드를 그대로 붙여 넣는다. 쿠팡 도메인 밖 주소가 있으면 빌드가 실패한다.
  # 다이내믹 배너(고객 관심 기반 추천 · 추천 상품 피드 · 680x140 · 테두리 없음). 화면 폭에 맞춰 비율대로 줄어든다
  # subId "banner": 쿠팡 보고서에서 배너 몫을 상품 상자(테마별 하위 ID)와 나눠 보려고 붙임(2026-10-28). 배너 안 클릭은 iframe이라 사이트 통계에는 안 잡힌다
  banner_html: |
    <script src="https://ads-partners.coupang.com/g.js"></script>
    <script>
    	new PartnersCoupang.G({"id":1038868,"template":"carousel","trackingCode":"AF4489672","subId":"banner","width":"680","height":"140","tsource":""});
    </script>
  banner_height: 140
  # 테마별 상품 링크(대시보드 "상품 링크"로 만든 https://link.coupang.com/a/… 주소). 테마 이름은 data/themes.yaml과 같게.
  # 리포트가 다루는 종목명·티커가 상품명에 들어가면 자동으로 뺀다.
  products: {}
  #  양자컴퓨팅:
  #    - name: "양자컴퓨터 입문서"
  #      url: "https://link.coupang.com/a/xxxxx"
  #      image: ""          # 선택. 쿠팡 이미지 주소
  #  _default:
  #    - name: "미국주식 투자 책"
  #      url: "https://link.coupang.com/a/yyyyy"
  products_per_box: 3
  blocked_words: []   # 법으로 막힌 상품만 막는다(쿠팡 판매 상품은 합법 상품이라 비워 둠)
  # 검색어에 "책"이 들어간 묶음에서만 빼는 단어: 어린이·청소년용 책은 리포트 독자와 맞지 않는다
  book_blocked_words: ["십 대", "10대", "청소년", "어린이", "초등", "중학생", "유아", "아동", "키즈", "그림책", "학습만화", "만화로", "만화 "]
  allowed_domains: ["coupang.com", "coupangcdn.com"]

# 자리별로 어떤 광고를 낼지 정한다. 쓸 수 있는 값:
#   adsense_in_article, adsense_display, adfit_report_end, adfit_list, coupang_banner, coupang_products, none
# 같은 위치에 두 광고가 붙으면 아래쪽을 끈다. 광고 개수 상한은 법적 의무가 아니므로 빌드가 막지 않는다(광고 네트워크 정책은 따로 지킨다).
# 값을 [가, 나] 목록으로 쓰면 앞에서부터 실제로 낼 수 있는 첫 광고를 낸다.
placements:
  report_mid: [adfit_report_mid, coupang_products]   # 본문 세 번째 소제목 앞(초반, 가장 많이 보이는 자리). 애드핏 300x250 번호가 있으면 애드핏, 없으면 쿠팡
  report_products: coupang_products     # "운영자 판단" 섹션 뒤, 없으면 본문 끝
  report_recommend: dable_report        # 출처 목록 아래, 쿠팡 상자 바로 위: 데이블 '같이 볼 만한 글' 위젯(번호가 없으면 아무것도 없음)
  report_end: coupang_products          # 출처 목록 아래. 애드핏 승인 뒤 adfit_report_end 와 성과 비교
  report_bottom: [adfit_report_end, coupang_products]  # 면책 고지 위. 짧은 리포트는 애드핏 '리포트 하단'(320x100), 4분의 3 지점에서 이미 썼으면 쿠팡
  list: [adfit_list, coupang_products]  # 홈·테마·종목 목록 페이지 (한 개만). 애드핏 320x100
  report_late: [adfit_report_end, coupang_products]  # 긴 리포트(본문 1만 5천 자 이상)만: 본문 4분의 3 지점 소제목 앞. 2026-10-19 애드핏 '리포트 하단'을 맨 아래(보이는 비율 1%)에서 이 자리로 올림. 단위는 한 페이지 한 번이라 이 자리에 쓰면 맨 아래는 쿠팡
  rail: [adfit_rail, coupang_products]  # 넓은 화면(PC) 오른쪽 칸 아래에 따라 내려오는 상자. 휴대폰에서는 안 보임(리포트: 목차 아래, 홈: 인사이트 아래)
  feed_inline: [adfit_feed, adfit_feed2, adsense_in_article, coupang_products]   # 홈 피드 사이(처음 HTML의 고정 자리, 아래 rhythm.home_feed): 애드핏 피드 → 애드핏 피드2 → 애드센스 → 쿠팡. 목록 광고(list)가 첫 자리
  page_bottom: [adfit_bottom, coupang_banner]   # (애드핏 '하단' 단위가 있고 그 페이지 애드핏이 4개 미만이면 애드핏) 페이지 맨 아래: 리포트(면책 위, 애드핏 하단 뒤)·홈 피드 끝·종목·테마 목록 아래. 쿠팡 다이내믹 배너
  explore: [adfit_list, coupang_products]   # 검색·탐색: 첫 탭(인기 종목)의 '요즘 많이 찾는 종목' 아래, 전체 종목 목록 위(한 개)
  explore_inline: [adsense_in_article, coupang_products]      # 검색·탐색의 다른 탭 목록 6번째 줄 뒤 + 검색 결과 3번째 뒤(화면에서 끼워 넣는 자리)
  profile_inline: [adsense_in_article, coupang_products]      # 프로필 글 목록 4번째 글 뒤(글이 5개 이상일 때만, 화면에서 끼워 넣는 자리)
  dm_list: [adfit_list, coupang_products]   # 쪽지함 대화 목록 아래(대화 화면에는 없음)
  post_detail: [adfit_list, coupang_products]   # 글 상세: 원글과 답글 사이(한 개)
  thread_inline: [adsense_in_article, coupang_products]   # 커뮤니티 목록·답글 사이(글이 쌓였을 때만, 아래 rhythm). 화면에서 끼워 넣고 더 보기로 계속 채우는 자리라 애드핏 불가(운영정책) → 애드센스 인피드/인아티클, 없으면 쿠팡

# 글 사이 광고 리듬: first번째 글 뒤부터 every개마다, 최대 max개. 글이 적을 때는 광고를 넣지 않는다(내용보다 광고가 먼저 보이지 않게).
# 간격은 5개 이상, 최대 개수는 아래 값이 상한(빌드가 검사).
rhythm:
  report_comments: {first: 6, every: 6, max: 3}   # 리포트 댓글
  board: {first: 4, every: 6, max: 4}             # 종토방(종목 페이지 목록 광고와 별도)
  home_feed: {first: 4, every: 6, max: 5}         # 홈 피드: 4번째 글 뒤(목록 광고) → 10·16·22·28번째 뒤

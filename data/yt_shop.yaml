# 유튜브 영상 쿠팡 파트너스 카테고리 실험(운영자 지시 2026-11-10 "다양한 카테고리로 태그 넣어서 추적하고 전환율 봐가면서 최적화").
# scripts/yt_shop.py 가 영상마다 카테고리 하나를 고르고 상품 후보를 찾는다. 하위 ID = "yt" + 카테고리 코드(2자) + 소문자 티커(예: ytbklaes).
# 쿠팡 실적(클릭·수수료)을 하위 ID 앞 4자로 묶어 카테고리별로 비교하고, 영상당 성과가 좋은 카테고리를 더 자주 고른다.
#
# 고르는 규칙
#   1) 최근 window_days 안에 쓴 영상 수가 explore_min 보다 적은 카테고리가 있으면 그중 가장 적게 쓴 것(시험 단계)
#   2) 아니면 exploit_pct% 확률로 영상당 수수료(같으면 영상당 클릭)가 가장 높은 카테고리, 나머지 확률로 다른 카테고리 하나(계속 탐색)
#   같은 티커·같은 날 다시 부르면 같은 결과(재현 가능). force 입력으로 카테고리를 직접 정할 수 있다.
#
# keywords 의 {theme} 은 그 종목 테마 이름(data/tickers.yaml)으로 바뀐다. 카테고리 안에서는 가장 적게 쓴 검색어부터 돌린다.
# theme_items: true 면 data/coupang.yaml 의 그 테마 검색어를 쓴다.
# 상품 문구(line)는 영상 속 카드·설명란·고정댓글 안내에 쓴다. 효능·수익을 말하지 않는다(건강기능식품은 효능 표현 금지).

window_days: 60
explore_min: 3
exploit_pct: 75

categories:
  bk:
    name: "투자서"
    line: "영상 속 산업을 더 깊이 이해하고 싶다면"
    books_only: true
    keywords: ["{theme} 책", "미국 주식 투자 책", "주식 차트 공부 책", "경제 위기 역사 책"]
  th:
    name: "영상 테마 연관 상품"
    line: "영상 속 산업과 이어지는 물건"
    theme_items: true
    keywords: []
  it:
    name: "투자자 IT기기"
    line: "차트를 오래 보는 분께"
    keywords: ["모니터", "태블릿PC", "무선 이어폰", "블루투스 키보드"]
  hl:
    name: "건강"
    line: "오래 화면을 보는 분들이 많이 찾는"
    keywords: ["루테인", "오메가3", "밀크씨슬"]
  lf:
    name: "생활"
    line: "시청자분들이 많이 찾는 생활용품"
    keywords: ["목 어깨 안마기", "전동칫솔", "전기면도기", "남성 올인원 로션"]
  hb:
    name: "취미"
    line: "주말에 쓰기 좋은"
    keywords: ["골프공", "등산 스틱", "골프 장갑", "캠핑 의자"]

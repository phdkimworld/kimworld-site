# 쿠팡 파트너스 API 자동 상품 설정 (scripts/coupang_sync.py 가 읽는다).
# 키는 여기 넣지 않는다. GitHub 저장소 Settings → Secrets → Actions 의
# COUPANG_ACCESS_KEY / COUPANG_SECRET_KEY 로만 읽는다.
#
# 테마마다 검색어 3개(리포트 한 페이지의 쿠팡 상자 3개가 서로 다른 검색어를 보여 준다). 처음 고른 검색어는 "팔릴 것 같다"는 가설이며,
# 검색어마다 하위 ID(sub_id)가 달라 쿠팡 실적에서 검색어별 클릭·주문을 따로 볼 수 있다.
# 방문할 때마다 같은 테마의 검색어 묶음 가운데 하나를 무작위로 보여 주므로 노출이 고르게 나뉜다.

max_calls_per_run: 5        # 한 번 동기화할 때 검색 API 호출 상한(쿠팡 검색 API는 시간당 10회)
max_calls_per_hour: 9       # 지난 1시간 호출 합계 상한. 매시 실행 간격이 1시간보다 조금 짧아도(예: 59분) 5+4회로 계속 받도록 실행당 5회로 나눈다
refresh_hours: 20           # 이보다 최근에 받은 검색어는 다시 받지 않는다
results_per_keyword: 10     # 쿠팡 검색 API 최대 10

# 독자층(유튜브 시청자 2026-10 기준: 남성 89%, 35~64세 80%, 가장 많은 45~54세 34%)에 맞춘다.
# 책은 수요가 적어 뺐다(운영자 결정, 2026-10-14). 테마 검색어는 '그 테마와 이어지는 실제로 많이 사는 물건',
# common 은 테마와 상관없이 이 연령·성별이 많이 사는 생활·건강·취미 상품으로, 모든 쿠팡 상자에 섞여 들어가고
# 브라우저 학습(클릭·수수료)이 잘 팔리는 묶음을 더 자주 보여 준다.
keywords:
  양자컴퓨팅: ["노트북", "태블릿PC", "블루투스 키보드"]
  AI 반도체: ["모니터", "무선 마우스", "기계식 키보드"]
  우주항공·방산: ["쌍안경", "천체망원경", "드론"]
  휴머노이드: ["로봇청소기", "AI 스피커", "스마트 플러그"]
  AI 소프트웨어: ["태블릿PC 거치대", "웹캠", "노트북 거치대"]
  원자력·에너지: ["대용량 보조배터리", "캠핑 파워뱅크", "LED 전구"]
  비트코인·AI 데이터센터: ["외장 SSD", "와이파이 공유기", "USB 허브"]
  소비재·밈주식: ["캡슐커피 머신", "에어프라이어", "무선청소기"]
  로봇·자율주행: ["블랙박스", "로봇청소기 소모품", "차량용 무선충전 거치대"]
  전기차·배터리: ["차량용 무선충전기", "타이어 공기주입기", "차량용 공기청정기"]
  산업재·인수합병: ["전동드릴", "공구세트", "작업화"]
  광물·자원: ["골드바", "실버바", "등산화"]
  석유·가스: ["연료첨가제", "캠핑 난로", "세차용품"]
  코인·블록체인: ["하드웨어 지갑", "보안 USB", "지문인식 금고"]
  바이오·헬스케어: ["혈압계", "유산균", "체성분 체중계"]
  리츠·배당: ["홍삼", "안마의자", "공기청정기"]
  미디어·스트리밍: ["빔프로젝터", "사운드바", "스마트TV"]

# 테마와 상관없이 독자층(남성 35~64세)이 많이 사는 상품. 모든 쿠팡 상자에 몇 개씩 섞인다(상자마다 4개씩 돌아가며)
common: ["루테인", "오메가3", "밀크씨슬", "무선 이어폰", "스마트워치", "전기면도기",
         "목 어깨 안마기", "전동칫솔", "골프공", "골프 장갑", "등산 스틱", "남성 올인원 로션"]

# 용어 사전. 리포트 본문에서 각 용어가 처음 나오는 곳에 점선 밑줄이 생기고, 누르면 뜻이 보인다.
# term: 본문에 쓰이는 그대로의 표기. 영문 약어는 앞뒤가 영문자가 아닐 때만 맞춘다.
- term: "PER"
  def: "주가수익비율. 주가를 주당순이익으로 나눈 값. 회사가 버는 이익에 비해 주가가 몇 배인지 보여 준다. 적자 기업은 계산할 수 없다."
- term: "PSR"
  def: "주가매출비율. 시가총액을 연간 매출로 나눈 값. 아직 이익이 없는 성장 기업을 비교할 때 자주 쓴다."
- term: "EV/Sales"
  def: "기업가치(시가총액 + 순부채)를 매출로 나눈 값. 회사가 가진 현금과 빚까지 반영해 PSR보다 정확하게 비교한다."
- term: "시가총액"
  def: "주가 × 발행 주식 수. 시장이 매긴 회사 전체의 값."
- term: "현금 소진"
  def: "적자 기업이 영업과 투자에 쓰는 현금의 속도. 보유 현금을 이 속도로 나누면 추가 자금 조달 없이 버틸 수 있는 기간을 어림할 수 있다."
- term: "잉여현금흐름"
  def: "영업으로 들어온 현금에서 설비 투자에 쓴 현금을 뺀 것. 회사가 실제로 자유롭게 쓸 수 있는 현금."
- term: "매출총이익률"
  def: "매출에서 원가를 뺀 이익이 매출의 몇 퍼센트인지. 제품 자체의 수익성을 보여 준다."
- term: "수주잔고"
  def: "계약은 맺었지만 아직 매출로 잡히지 않은 일감의 총액. 앞으로의 매출을 가늠하는 지표."
- term: "유상증자"
  def: "회사가 새 주식을 발행해 투자자에게 팔아 돈을 모으는 것. 기존 주주의 지분 비율이 낮아질 수 있다(희석)."
- term: "희석"
  def: "새 주식 발행, 전환사채 전환, 스톡옵션 행사 등으로 주식 수가 늘어 기존 주주 한 주의 몫이 줄어드는 것."
- term: "10-K"
  def: "미국 상장사가 매년 SEC에 내는 연간 보고서. 사업 내용, 위험 요인, 감사받은 재무제표가 들어 있다."
- term: "10-Q"
  def: "미국 상장사가 분기마다 SEC에 내는 보고서. 감사 대신 검토를 받은 분기 재무제표가 들어 있다."
- term: "8-K"
  def: "미국 상장사가 중요한 일(실적 발표, 계약, 경영진 변동 등)이 생기면 수시로 내는 공시."
- term: "가이던스"
  def: "회사가 직접 밝힌 앞으로의 실적 전망(매출·이익 범위 등)."
- term: "큐비트"
  def: "양자컴퓨터의 정보 단위. 0과 1을 동시에 담는 중첩 상태를 쓸 수 있다. 개수만큼 오류율(충실도)이 중요하다."
- term: "충실도"
  def: "양자 연산이 의도대로 정확하게 수행되는 비율. 99.9%처럼 표시하며, 높을수록 오류가 적다."

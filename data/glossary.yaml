# 용어 사전. 리포트 본문에서 각 용어가 처음 나오는 곳에 점선 밑줄이 생기고, 누르면 뜻이 보인다.
# term: 본문에 쓰이는 그대로의 표기. 영문 약어는 앞뒤가 영문자가 아닐 때만 맞춘다.
- term: "PER"
  def: "주가수익비율. 주가를 주당순이익으로 나눈 값. 회사가 버는 이익에 비해 주가가 몇 배인지 보여 준다. 적자 기업은 계산할 수 없다."
- term: "PSR"
  def: "주가매출비율. 시가총액을 연간 매출로 나눈 값. 아직 이익이 없는 성장 기업을 비교할 때 자주 쓴다."
- term: "EV/Sales"
  def: "기업가치(시가총액 + 순부채)를 매출로 나눈 값. 회사가 가진 현금과 빚까지 반영해 PSR보다 정확하게 비교한다."
- term: "시가총액"
  def: "주가 × 발행 주식 수. 시장이 매긴 회사 전체의 값."
- term: "현금 소진"
  def: "적자 기업이 영업과 투자에 쓰는 현금의 속도. 보유 현금을 이 속도로 나누면 추가 자금 조달 없이 버틸 수 있는 기간을 어림할 수 있다."
- term: "잉여현금흐름"
  def: "영업으로 들어온 현금에서 설비 투자에 쓴 현금을 뺀 것. 회사가 실제로 자유롭게 쓸 수 있는 현금."
- term: "매출총이익률"
  def: "매출에서 원가를 뺀 이익이 매출의 몇 퍼센트인지. 제품 자체의 수익성을 보여 준다."
- term: "수주잔고"
  def: "계약은 맺었지만 아직 매출로 잡히지 않은 일감의 총액. 앞으로의 매출을 가늠하는 지표."
- term: "유상증자"
  def: "회사가 새 주식을 발행해 투자자에게 팔아 돈을 모으는 것. 기존 주주의 지분 비율이 낮아질 수 있다(희석)."
- term: "희석"
  def: "새 주식 발행, 전환사채 전환, 스톡옵션 행사 등으로 주식 수가 늘어 기존 주주 한 주의 몫이 줄어드는 것."
- term: "10-K"
  def: "미국 상장사가 매년 SEC에 내는 연간 보고서. 사업 내용, 위험 요인, 감사받은 재무제표가 들어 있다."
- term: "10-Q"
  def: "미국 상장사가 분기마다 SEC에 내는 보고서. 감사 대신 검토를 받은 분기 재무제표가 들어 있다."
- term: "8-K"
  def: "미국 상장사가 중요한 일(실적 발표, 계약, 경영진 변동 등)이 생기면 수시로 내는 공시."
- term: "가이던스"
  def: "회사가 직접 밝힌 앞으로의 실적 전망(매출·이익 범위 등)."
- term: "큐비트"
  def: "양자컴퓨터의 정보 단위. 0과 1을 동시에 담는 중첩 상태를 쓸 수 있다. 개수만큼 오류율(충실도)이 중요하다."
- term: "충실도"
  def: "양자 연산이 의도대로 정확하게 수행되는 비율. 99.9%처럼 표시하며, 높을수록 오류가 적다."
- term: "스팩"
  def: "다른 회사와 합병해 상장시키는 것만을 목적으로 먼저 상장한 회사. 합병 때 기존 스팩 주주는 주식 대신 현금 상환을 고를 수 있고, 기준가는 보통 주당 10달러다."
- term: "13F"
  def: "운용 자산이 큰 기관 투자자가 분기마다 미국 증권거래위원회에 내는 보유 주식 목록. 분기가 끝나고 45일 안에 공개된다."
- term: "언아웃"
  def: "회사를 인수할 때 정한 실적 목표를 채우면 판 사람에게 대가를 더 주기로 한 약속. 장부에는 부채로 오르고, 그 가치가 바뀌면 손익에 반영된다."
- term: "조정 EBITDA"
  def: "이자, 세금, 감가상각, 주식 보상, 일회성 항목 등을 빼고 계산한 영업 성과. 회사가 따로 밝히는 기준이라 회사마다 계산 방식이 다를 수 있다."
- term: "내부통제 중대 약점"
  def: "재무 보고의 오류를 막는 회사 안의 절차에 큰 구멍이 있다는 판단. 공시에 적히면 숫자의 신뢰에 대한 경고로 읽힌다."
- term: "공매도 비율"
  def: "유통 주식 가운데 주가 하락에 거는 공매도로 잡혀 있는 물량의 비율. 높으면 하락 압력이 크지만, 공매도 투자자가 한꺼번에 되사면 급등이 생기기도 한다."
- term: "매출 배수"
  def: "시가총액을 1년 매출로 나눈 값. 이익이 없는 성장 기업의 값을 비교할 때 쓴다."
- term: "이동평균선"
  def: "최근 일정 기간 종가의 평균을 이은 선. 주가의 추세를 볼 때 쓴다."
- term: "유망자원"
  def: "아직 시추로 확인하지 않은 석유가 있을 수 있다고 추정한 양. 확인된 매장량과 다르다."
- term: "팜아웃"
  def: "광구를 가진 회사가 시추 비용을 대신 내주는 상대에게 지분 일부를 넘기기로 한 계약."
- term: "탐사정"
  def: "석유가 있는지 확인하려고 처음 뚫는 우물."
- term: "신주인수권"
  def: "정해진 가격에 새 주식을 살 수 있는 권리(워런트). 행사되면 주식 수가 늘어난다."
- term: "공매도 보고서"
  def: "주가 하락에 거는 투자자가 회사의 문제를 주장하며 내는 분석 보고서."
- term: "기업공개"
  def: "비상장 회사가 새 주식을 공모해 거래소에 처음 상장하는 것. 스팩 합병과 달리 회사가 직접 공모 가격을 정해 투자자에게 판다."
- term: "락업"
  def: "상장 뒤 일정 기간 기존 주주와 임원이 주식을 팔지 못하게 한 약속. 기간이 끝나면 매물이 한꺼번에 나올 수 있다."
- term: "정부 연구개발 계약"
  def: "정부 기관이 특정 기술 개발을 맡기고 대가를 주는 계약. 분기마다 금액과 시점이 크게 달라진다."
- term: "편의 해지 조항"
  def: "정부가 상대의 잘못이 없어도 자신의 판단에 따라 계약을 끝낼 수 있게 한 조항."
- term: "옵션 기간"
  def: "정부 계약에서 기본 기간 뒤에 정부가 해마다 연장 여부를 고를 수 있는 기간. 계약 최대치에는 들어가지만 확정된 돈은 아니다."
- term: "러셀 마이크로캡 지수"
  def: "미국 초소형 상장사로 구성된 주가지수. 편입되면 이 지수를 따르는 자금이 기계적으로 주식을 산다."
- term: "블록 매도"
  def: "많은 주식을 시장 밖에서 한 번에 넘기는 거래. 큰 물량을 받아 주는 대가로 시세보다 싸게 정해지는 경우가 많다."
- term: "계속기업 불확실성"
  def: "회사가 앞으로 1년 동안 정상적으로 사업을 이어 갈 수 있을지 의문이 있다고 재무제표에 적는 문구."
- term: "역분할"
  def: "여러 주를 한 주로 합치는 것. 주식 수는 줄고 한 주 가격은 그만큼 높아진다. 상장 유지 기준을 맞추려고 하는 경우가 많다."
- term: "등록직접공모"
  def: "회사가 공개 모집 대신 특정 투자자에게 미리 정한 가격으로 새 주식을 파는 방식. 보통 시세보다 싸게 정해진다."
- term: "시장 판매 계약"
  def: "회사가 정해진 한도 안에서 시장 가격으로 새 주식을 조금씩 팔 수 있게 증권사와 맺는 계약. 영어 약자로 ATM이라고 부른다."
- term: "양자내성암호"
  def: "양자컴퓨터로도 풀기 어렵게 설계한 암호. 미국 표준기술연구소가 2024년 첫 표준을 확정했다."
- term: "대칭키 합의"
  def: "통신하는 양쪽이 같은 암호 열쇠를 안전하게 나눠 갖는 방법."
- term: "롤업"
  def: "사모펀드가 같은 분야의 작은 회사 여러 곳을 잇달아 사들여 하나의 큰 회사로 묶는 전략."
- term: "전환우선주"
  def: "배당 등에서 보통주보다 앞서고, 정해진 가격에 보통주로 바꿀 수 있는 주식. 바뀌면 보통주 수가 늘어난다."
- term: "북투빌"
  def: "한 기간의 수주 금액을 같은 기간 매출로 나눈 값. 1을 넘으면 일감이 쌓이고 있다는 뜻이다."
- term: "다중 계약"
  def: "정부가 여러 업체를 한꺼번에 뽑아 두고, 실제 일감은 나중에 개별 발주로 나눠 주는 계약. 선정만으로는 매출이 보장되지 않는다."
- term: "비트코인 트레저리"
  def: "회사의 남는 돈과 새로 모은 자금으로 비트코인을 사서 오래 보유하는 전략."
- term: "mNAV"
  def: "시가총액을 회사가 가진 비트코인 가치로 나눈 값. 1배보다 크면 시장이 비트코인보다 비싸게, 작으면 싸게 평가한다는 뜻이다."
- term: "영구 우선주"
  def: "만기 없이 정해진 배당을 계속 주는 주식. 배당과 원금 청구에서 보통주보다 앞선다."
- term: "사모 투자"
  def: "상장사가 특정 투자자에게 미리 정한 가격으로 새 주식을 파는 방식(PIPE)."
- term: "주식 병합"
  def: "여러 주를 한 주로 합치는 것. 역분할과 같은 말이다."
- term: "레이어1 블록체인"
  def: "다른 체인에 기대지 않고 자체 검증자로 거래를 기록하는 기본 블록체인."
- term: "커뮤니티 바이백"
  def: "참여자가 맡긴 코인을 모아 체인 수익으로 되사고 소각하는 인젝티브의 월간 소각 방식."
- term: "스테이킹"
  def: "코인을 검증자에게 맡겨 네트워크 보안에 참여하고 새로 발행되는 코인을 보상으로 받는 것."
- term: "발행률"
  def: "스테이킹 보상으로 새로 찍어 내는 코인의 연간 비율."
- term: "TVL"
  def: "블록체인 위 서비스에 맡겨진 자금의 총액. 체인이 실제로 얼마나 쓰이는지 볼 때 쓴다."
- term: "메인넷 업그레이드"
  def: "운영 중인 블록체인에 새 기능을 더하는 것."
- term: "eVTOL"
  def: "전기 수직이착륙기. 전기 모터로 프로펠러를 돌려 헬리콥터처럼 떠오르고 비행기처럼 앞으로 나는 기체다."
- term: "형식 증명"
  def: "미국 연방항공청이 새 항공기 설계가 안전 기준을 모두 충족한다고 인정하는 최종 인증. 승객 운항의 전제 조건이다."
- term: "특별 감항 증명"
  def: "시험 비행처럼 정해진 목적의 비행만 허락하는 증명. 승객 운항 허가는 아니다."
- term: "전환사채"
  def: "정해진 가격(전환 가격)에 주식으로 바꿀 수 있는 회사채. 주가가 전환 가격을 넘으면 주식이 늘어난다."
- term: "사전 매매 계획"
  def: "임원이 미리 정해 둔 날짜와 수량에 따라 주식을 사고파는 계획. 미국에서는 규정 이름을 따 10b5-1 계획이라고 부른다."
- term: "현금 런웨이"
  def: "지금 가진 현금으로 추가 자금 조달 없이 버틸 수 있는 기간."
- term: "분사 상장"
  def: "모회사가 사업부를 떼어 내 별도 회사로 상장시키는 것. 새 자금을 모으는 공모 대신 기존 주주에게 주식을 나눠 주는 방식이 많다."
- term: "주당 현금"
  def: "회사가 가진 현금을 주식 수로 나눈 값. 주가가 이보다 낮으면 시장이 현금 밖의 사업 가치를 0 이하로 본다는 뜻이 된다."
- term: "보안 인증"
  def: "보안 칩이 공격에 견디는지 공인 기관이 시험해 주는 인증. 국제 공통평가기준(Common Criteria)과 미국 FIPS 140-3 등이 있으며, 정부·금융 고객은 인증 없는 칩을 잘 쓰지 않는다."
- term: "이온 트랩"
  def: "전기를 띤 원자(이온)를 전기장으로 공중에 붙잡아 두고 레이저로 조작해 큐비트로 쓰는 양자컴퓨터 방식."
- term: "자체 성장"
  def: "인수한 회사의 매출을 빼고 기존 사업만으로 늘어난 매출. 영어로는 오가닉 성장이라고 한다."
- term: "우라늄 농축"
  def: "원자로 연료로 쓸 수 있도록 우라늄 속 우라늄-235의 비율을 높이는 공정."
- term: "HALEU"
  def: "우라늄-235 비율을 5~20%로 높인 연료(고순도 저농축 우라늄). 차세대 소형 원자로에 필요하다."
- term: "원심분리기"
  def: "우라늄 기체를 고속으로 돌려 무게 차이로 성분을 나누는 농축 장비."
- term: "계약 대기 물량"
  def: "조건이 충족되면 매출이 될 수 있는 계약 잔액. 회사에 따라 조건부 백로그라고 부른다."
- term: "임계"
  def: "원자로 안에서 핵분열 연쇄반응이 외부 도움 없이 스스로 일정하게 이어지는 상태. 원자로가 처음 '켜졌다'는 뜻으로 쓰인다."
- term: "고속로"
  def: "물 대신 액체 금속 등으로 열을 식히고, 속도를 줄이지 않은 빠른 중성자로 핵분열을 일으키는 원자로."
- term: "기본 계약"
  def: "앞으로 개별 계약을 맺을 틀만 정한 계약. 그 자체로는 구속력이 없는 경우가 많다."
- term: "전력망 연결 검토"
  def: "새 발전소를 전력망에 연결해도 되는지 전력망 운영 기관이 차례로 심사하는 절차. 이 순서에서 빠지면 가동 일정이 늦어진다."
- term: "사전 매도 계획"
  def: "임원이 미리 정한 일정과 조건에 따라 자동으로 주식을 파는 계획. 내부 정보를 이용했다는 의심을 피하려고 쓴다."
- term: "리튬 금속 배터리"
  def: "음극에 흑연 대신 얇은 리튬 금속을 써서 같은 크기에 더 많은 에너지를 담으려는 차세대 배터리."
- term: "공동 개발 계약"
  def: "배터리 회사와 자동차 회사가 시제품을 함께 개발하고 시험하기로 한 계약. 제품을 사겠다는 약속은 아니다."
- term: "에너지 저장장치"
  def: "전기를 배터리에 저장했다가 필요할 때 꺼내 쓰는 설비. 영어 약자로 ESS라고 부른다."
- term: "상장 유지 기준"
  def: "거래소가 상장을 유지하려고 정한 조건. 뉴욕증권거래소는 30거래일 평균 종가가 1달러 아래면 경고를 보낸다."
- term: "희토류"
  def: "원소 17종을 묶어 부르는 이름. 전기차 모터, 드론, 미사일에 쓰는 강한 영구자석의 원료다."
- term: "NdPr"
  def: "네오디뮴과 프라세오디뮴. 영구자석에 가장 많이 쓰는 희토류다."
- term: "바닥 가격"
  def: "시장 가격이 정해진 값 아래로 내려가면 그 차이를 정부가 보전해 주는 약정."
- term: "수출 통제"
  def: "정부가 특정 물품의 해외 판매를 허가제로 묶거나 막는 것."
- term: "광 인터포저"
  def: "레이저와 광검출기 같은 빛 부품과 전자 부품을 반도체 판 하나 위에 한 번에 붙이는 기술."
- term: "광 엔진"
  def: "데이터센터 서버 사이에서 전기 신호를 빛 신호로 바꿔 주고받는 핵심 부품. 800G, 1.6T는 초당 전송 속도를 뜻한다."
- term: "수동적 외국 투자회사"
  def: "자산이나 소득의 대부분이 이자 같은 수동적 투자에서 나오는 외국 회사. 미국 세법상 그 주주는 세금 불이익을 받을 수 있다. 영어 약자로 PFIC라고 부른다."
- term: "비밀 유지 의무"
  def: "거래 상대방의 주문·가격 같은 정보를 허락 없이 공개하지 않기로 한 약속."
- term: "합성생물학"
  def: "미생물이나 세포의 유전자를 설계해 원하는 물질을 만들게 하는 기술."
- term: "자율 실험실"
  def: "사람 대신 로봇과 인공지능이 실험을 설계하고 돌리는 실험 시설."
- term: "주식 보상 비용"
  def: "임직원에게 현금 대신 주식으로 준 보상을 비용으로 잡은 것. 현금은 나가지 않지만 주식 수가 늘어난다."
- term: "면역증강제"
  def: "백신과 함께 넣어 면역 반응을 키우는 물질. 노바백스의 매트릭스엠이 대표적이다."
- term: "마일스톤"
  def: "협력사가 임상 시작, 허가, 출시 같은 단계를 달성할 때 지급하는 성과 보수."
- term: "긴급사용 승인"
  def: "감염병 비상 상황에서 정식 승인 전에 사용을 허락하는 제도."
- term: "자본 잠식"
  def: "부채가 자산보다 많아 장부상 자본이 마이너스인 상태."
- term: "토큰화"
  def: "데이터나 실물 자산의 권리를 블록체인 위의 토큰으로 바꿔 쪼개 사고팔 수 있게 하는 것."
- term: "특수관계자"
  def: "회사와 지배·영향 관계가 있어 거래 조건이 일반 거래와 다를 수 있는 상대방. 공시에 따로 적는다."
- term: "손상 처리"
  def: "보유 자산의 가치가 장부 가격보다 크게 떨어졌을 때 그 차이를 손실로 반영하는 것."
- term: "연간 계약 가치"
  def: "고객이 1년 동안 소프트웨어 사용료로 내기로 한 금액의 합(ACV). 회계상 매출을 언제 잡느냐와 상관없이 고객이 실제로 쓰는 돈의 크기를 보여 준다."
- term: "순매출 유지율"
  def: "기존 고객이 1년 전보다 돈을 얼마나 더 쓰는지 보여 주는 비율(NDR). 100%면 제자리, 100%를 넘으면 기존 고객의 지출이 늘었다는 뜻이다."
- term: "물리 기반 계산"
  def: "분자 사이의 힘을 물리 법칙으로 직접 계산해 약 후보가 표적 단백질에 얼마나 잘 붙는지 예측하는 방법."
- term: "구독형 전환"
  def: "소프트웨어를 한 번에 파는 설치형에서 서버에 올려 두고 기간에 따라 나눠 받는 방식으로 바꾸는 것. 전환하는 동안 회계상 매출이 줄어 보인다."
- term: "잔여 이행 의무"
  def: "고객과 계약은 맺었지만 아직 매출로 잡지 않은 금액(RPO). 앞으로 받을 일감의 크기를 보여 주지만, 언제 매출이 되는지는 계약마다 다르다."
- term: "AI 추론"
  def: "학습을 마친 인공지능 모델이 질문을 받아 답을 만드는 일. 서비스 이용자가 늘수록 필요한 연산이 커진다."
- term: "웨이퍼 스케일 엔진"
  def: "반도체 원판(웨이퍼) 한 장을 잘라 내지 않고 통째로 하나의 칩으로 만든 세레브라스의 칩."
- term: "핵심 매출"
  def: "고객에게 준 워런트 비용 같은 비현금 항목을 빼고 계산한 회사 기준 매출. 회계 기준 매출보다 크게 나온다."
- term: "차등의결권"
  def: "한 주에 여러 표가 붙은 주식 구조. 창업자나 초기 주주가 적은 지분으로도 회사를 지배할 수 있다."
- term: "우회 상장"
  def: "이미 상장된 회사와 합쳐 별도의 상장 심사 없이 상장 지위를 얻는 방식."
- term: "스테이블코인"
  def: "달러나 원화 같은 법정화폐에 가치를 맞춘 디지털 화폐."
- term: "인공지능 신약 개발"
  def: "실험 데이터와 기계학습 모델로 질병의 표적과 약 후보를 찾는 방법. 후보를 빨리 찾을 수 있다는 기대가 있지만, 그 약이 환자에게서 효과를 보이는지는 임상으로 따로 증명해야 한다."
- term: "공동 연구 계약"
  def: "대형 제약사가 선급금과 단계별 마일스톤을 내고 함께 신약 후보를 찾는 계약."
- term: "분기 보유 내역 공시"
  def: "운용 자산이 큰 미국 기관투자자가 분기마다 보유 주식을 밝히는 공시(13F). 분기가 끝나고 45일 안에 나오므로 실제 매매보다 늦게 알려진다."
- term: "소형모듈원전"
  def: "공장에서 모듈로 만들어 현장에 옮겨 조립하는 작은 원자로(SMR). 대형 원전보다 건설 기간과 초기 비용을 줄이는 것을 목표로 한다."
- term: "설계 승인"
  def: "미국 원자력규제위원회가 원자로 설계의 안전성을 검토해 내주는 승인. 실제 발전소를 지으려면 별도의 건설·운영 허가가 필요하다."
- term: "전력 구매 계약"
  def: "발전소가 만든 전기를 정해진 조건으로 장기간 사겠다는 계약(PPA). 발전소 금융과 건설의 출발점이 된다."
- term: "파트너 지급 계약"
  def: "뉴스케일이 판매 파트너 엔트라원에게 원자로 모듈 하나마다 3,500만~5,500만 달러를 사업 단계에 따라 나눠 내기로 한 계약(2025년 8월). 돈이 고객에게서 오는 것이 아니라 파트너에게로 나간다."
- term: "기업인수목적회사"
  def: "다른 회사와 합병하는 것만을 목적으로 먼저 상장하는 회사(스팩). 합병하면 대상 회사가 별도의 공모 없이 상장된다."
- term: "레이어2"
  def: "기존 블록체인 위에 얹혀 그 보안을 빌려 쓰면서 더 많은 기능을 제공하는 네트워크."
- term: "sBTC"
  def: "비트코인을 스택스 네트워크로 1대 1로 옮겨 쓰는 토큰. 서명자 집단이 원래 비트코인을 보관한다."
- term: "스태킹"
  def: "스택스 코인을 일정 기간 묶어 두고 채굴자가 낸 비트코인을 보상으로 받는 스택스 고유의 방식(PoX)."
- term: "비트코인 스테이킹 본드"
  def: "기관이 비트코인을 6개월 동안 묶고 비트코인으로 이자를 받는 스택스의 상품. 비트코인 가치의 약 5%에 해당하는 스택스를 함께 묶는다."
- term: "김치 프리미엄"
  def: "국내 거래소 코인 가격이 해외 가격보다 비싼 정도. 한국 매수세가 강하면 커진다."
- term: "모니터링 태그"
  def: "바이낸스가 변동성과 위험이 다른 코인보다 큰 코인에 붙이는 표시. 정기 검토 뒤 떼거나 유지한다."
- term: "신주인수권 행사 유도"
  def: "회사가 새 권리를 덤으로 주는 대신 투자자가 기존 신주인수권을 지금 바로 행사하게 해 현금을 받는 거래."
- term: "공정가치 평가"
  def: "빚이나 권리의 값을 분기마다 시장 가격에 맞춰 다시 매기는 회계 방식. 늘어난 값은 손실, 줄어든 값은 이익으로 적는다."
- term: "발행 한도"
  def: "정관에 정해 둔, 회사가 발행할 수 있는 주식의 최대 수. 늘리려면 주주 승인이 필요하다."
- term: "45V 세액공제"
  def: "미국에서 청정 수소를 생산하면 1kg당 최대 3달러까지 세금을 깎아 주는 제도."
- term: "재고 자산"
  def: "회사가 만들어 두었지만 아직 팔지 않은 완성품, 만드는 중인 제품, 원자재와 부품의 장부 가치."
- term: "재고평가손실"
  def: "재고를 팔아서 받을 수 있는 돈이 장부 가치보다 낮아질 때 그 차이만큼 재고 값을 깎아 비용으로 적는 것."
- term: "지연 인출 대출"
  def: "한도를 미리 정해 두고 필요할 때 나눠 꺼내 쓰는 대출(DDTL)."
- term: "자본총계"
  def: "자산에서 부채를 뺀 장부상 주주의 몫. 마이너스면 장부상 빚이 자산보다 많다."
- term: "모기지 리츠"
  def: "부동산 대신 주택담보대출 채권에 투자하고, 이익 대부분을 배당으로 나눠 주는 회사."
- term: "에이전시 MBS"
  def: "미국 정부 지원 기관(패니메이, 프레디맥, 지니메이)이 원리금 지급을 보증하는 주택저당증권. 떼일 위험은 작지만 금리에 따라 값이 크게 바뀐다."
- term: "유형 장부가치"
  def: "자산에서 부채와 우선주, 영업권 같은 무형자산을 뺀 값. 영어 약자로 TBV라고 부른다."
- term: "장부 대비 주가"
  def: "주가를 한 주당 장부가치로 나눈 배수. 1보다 크면 웃돈(프리미엄), 작으면 할인이다."
- term: "경제적 수익률"
  def: "한 기간 동안 장부가치 변화와 배당을 더해 기초 장부가치로 나눈 값. 회사 실력으로 번 수익에 가깝다."
- term: "ATM 증자"
  def: "회사가 증권사를 통해 시장에서 조금씩 새 주식을 파는 방식(at-the-market). 한 번에 큰 할인 없이 자금을 모을 수 있다."
- term: "레버리지"
  def: "자기자본 대비 빌린 돈의 배수. 빌린 돈이 클수록 같은 가격 변화에 장부가 더 크게 흔들린다."
- term: "헤지 비율"
  def: "금리가 오를 때 생기는 손실을 막아 주는 금리 스와프 등 위험 회피 수단이 차입금의 몇 퍼센트를 덮는지 나타낸 값."
- term: "하이퍼스케일러"
  def: "아마존 웹서비스, 마이크로소프트, 구글처럼 전 세계에 초대형 데이터센터를 운영하는 클라우드 회사."
- term: "계약 매출"
  def: "이미 서명한 임대 계약에서 앞으로 받기로 정해진 임대료의 합계. 아직 받은 돈이 아니라 계약 기간에 걸쳐 들어올 돈이다."
- term: "IT 메가와트"
  def: "데이터센터에서 서버가 실제로 쓸 수 있는 전력 용량. 냉각 등을 포함한 전체 전력 용량보다 작다."
- term: "프로젝트 담보 채권"
  def: "데이터센터 한 곳의 자산과 임대료를 담보로 그 프로젝트 회사가 발행하는 채권."
- term: "선도 계약"
  def: "주식을 정해진 날에 넘기기로 하고 돈을 미리 받는 계약. 정산일 주가에 따라 넘길 주식 수가 달라진다."
- term: "유전자 가위"
  def: "세포 속 유전자의 특정 부분을 잘라 고치거나 끄는 기술(CRISPR). 2020년 노벨 화학상을 받았다."
- term: "체내 치료"
  def: "세포를 몸 밖으로 꺼내지 않고, 약을 몸 안에 넣어 그 자리에서 유전자를 고치는 방식."
- term: "유전성 혈관부종"
  def: "피부·기도·장 등이 갑자기 붓는 발작이 평생 반복되는 희귀 유전 질환(HAE)."
- term: "허가 신청"
  def: "바이오 의약품을 팔기 위해 FDA에 내는 승인 신청서(BLA)."
- term: "우선 심사"
  def: "FDA가 보통보다 짧은 기간에 심사하는 제도. 결정 목표일을 PDUFA 결정일이라고 부른다."
- term: "임상 보류"
  def: "FDA가 안전 문제 등으로 임상 시험을 멈추게 하는 조치."
- term: "숏 커버링"
  def: "공매도한 사람이 빌린 주식을 갚기 위해 시장에서 주식을 사는 것. 한꺼번에 몰리면 주가가 급등할 수 있다."
- term: "타당성 조사"
  def: "광산을 지을지 결정하기 위해 매장량, 건설비, 수익성을 정밀하게 계산하는 조사(DFS)."
- term: "의향서"
  def: "거래 의사를 밝히는 문서(LOI). 법적 구속력이 없다."
- term: "사모 증자"
  def: "특정 투자자에게 새 주식을 정해진 가격에 파는 것(PIPE). 보통 시장 가격보다 싸다."
- term: "매수 권리"
  def: "정해진 가격에 새 주식을 살 수 있는 권리(워런트). 주가가 그 가격을 넘으면 주식 수가 늘어난다."
- term: "디지털 자산 트레저리"
  def: "회사 자금의 대부분을 특정 가상자산으로 보유하는 전략. 주식을 팔아 코인을 사는 구조가 많다."
- term: "슈퍼 밸리데이터"
  def: "캔톤 네트워크를 운영하고 그 보상으로 캔톤 코인을 받는 핵심 운영자."
- term: "캔톤 코인"
  def: "금융기관용 블록체인인 캔톤 네트워크의 토큰(CC). 네트워크 사용료와 운영자 보상에 쓰인다."
- term: "사전 납입 워런트"
  def: "돈을 미리 내고 거의 0원에 주식으로 바꿀 수 있는 권리. 사실상 주식과 같아서 주식 수를 셀 때 함께 센다."
- term: "이연 법인세 부채"
  def: "장부상 이익이 났지만 아직 내지 않은 세금. 그 자산을 팔면 실제로 낼 수 있다."
- term: "맞춤형 칩"
  def: "구글·아마존 같은 빅테크가 자기 데이터센터에 맞게 설계를 주문하는 인공지능 칩. 커스텀 실리콘, XPU라고도 부른다."
- term: "광통신 칩"
  def: "데이터센터 안에서 전기 신호를 빛으로 바꿔 서버 사이에 데이터를 옮기는 칩."
- term: "전환 우선주"
  def: "정해진 가격에 보통주로 바꿀 수 있는 우선주."
- term: "필라델피아 반도체 지수"
  def: "미국 상장 반도체 회사 30곳으로 만든 지수(SOX). 반도체 업종 전체의 분위기를 보여 준다."
- term: "내부 조사"
  def: "이사회가 독립 이사로 위원회를 꾸리고 외부 변호인을 선임해 회사 안의 문제를 살피는 절차. 결과를 어디까지 공개할지는 회사가 정한다."
- term: "분리 합의서"
  def: "임원이 회사를 떠날 때 받는 대가와 서로의 소송 포기 범위를 정한 계약."
- term: "나스닥 최저 호가 규정"
  def: "종가가 30거래일 연속 1달러 아래면 통지를 받고, 정해진 기간 안에 회복하지 못하면 상장 폐지 절차에 들어가는 나스닥 규정."
- term: "마이크로 원자로"
  def: "공장에서 만들어 현장에 설치하는 아주 작은 원자로. 보통 전기 출력 20메가와트 이하를 말한다."
- term: "10b5-1 매매 계획"
  def: "임원·대주주가 내부 정보 거래 의심을 피하려고 언제 얼마를 팔지 미리 정해 두는 주식 매매 계획."
- term: "칩렛"
  def: "작은 칩 여러 개를 이어 붙여 큰 칩처럼 쓰는 방식. 큰 칩 하나를 한 번에 만드는 것보다 불량이 적고, 칩 수를 늘려 규모를 키우기 쉽다."
- term: "CHIPS법"
  def: "2022년 제정된 미국 반도체·첨단기술 지원법. 상무부가 이 법의 예산으로 기업에 연구개발 자금을 대고, 일부는 그 대가로 지분을 받는다."
- term: "수주 잔고"
  def: "계약은 맺었지만 아직 매출로 잡히지 않은 일감의 합계. 백로그라고도 한다."
- term: "임시 예산"
  def: "미국 의회가 새 회계연도 예산을 통과시키지 못했을 때 전년 수준으로 정부를 운영하는 임시 조치(CR). 새 사업 착수가 늦어진다."
- term: "고객 집중도"
  def: "매출 가운데 가장 큰 고객 한 곳이 차지하는 비율. 높을수록 그 고객의 결정에 실적이 크게 흔들린다."
- term: "선수금"
  def: "고객이 일을 받기 전에 미리 낸 돈. 현금에는 들어가지만 앞으로 일을 해 줘야 하는 몫이다."
- term: "폐동맥 고혈압"
  def: "폐동맥이 좁아지고 굳어 심장에 부담이 커지는 드문 만성 질환. 영어 약자로 PAH라고 부른다."
- term: "PH-ILD"
  def: "간질성 폐질환에 동반된 폐고혈압. 폐 조직이 굳는 병과 폐고혈압이 함께 있는 상태다."
- term: "적응증"
  def: "약을 쓰도록 승인된 질환. 라벨에서 빠지면 그 용도로 홍보할 수 없다."
- term: "청구항"
  def: "특허가 보호하는 범위를 하나하나 적은 문장. 법원은 청구항마다 유효한지, 침해됐는지를 따로 판단한다."
- term: "임시 승인"
  def: "약 자체는 승인 기준을 넘었지만 다른 제품의 독점 기간이 끝날 때까지 판매할 수 없는 상태."
- term: "장외 시장"
  def: "거래소에 상장되지 않은 주식이 거래되는 시장(OTC). 거래량이 적고 큰 투자자가 사기 어렵다."
- term: "골든 파워"
  def: "이탈리아 정부가 방산 등 전략 산업의 외국인 인수를 심사해 승인하거나 조건을 붙이는 제도."
- term: "계속 기업 의문"
  def: "회사가 앞으로 12개월 동안 사업을 이어갈 수 있을지 상당한 의문이 있다는 회계상 표현."
- term: "재무제표 신뢰 불가 공시"
  def: "이미 낸 재무제표에 중대한 오류가 있어 믿지 말라고 회사가 알리는 공시(8-K Item 4.02). 정정본을 다시 낸다."
- term: "염기 편집"
  def: "유전자를 자르지 않고 DNA 글자 하나를 다른 글자로 바꾸는 유전자 편집 기술."
- term: "프라임 편집"
  def: "글자 하나보다 긴 DNA 구간을 찾아 고쳐 쓰는 유전자 편집 기술."
- term: "겸상 적혈구 빈혈"
  def: "적혈구가 낫 모양으로 변해 혈관을 막는 유전병."
- term: "빠른 승인"
  def: "최종 효과 대신 혈액 수치 같은 지표 개선으로 먼저 승인하고 나중에 효과를 확인하는 FDA 제도(가속 승인)."
- term: "중재"
  def: "법원 대신 계약 당사자가 정한 중재인이 분쟁을 판정하는 절차. 결과는 보통 다시 다투기 어렵다."
- term: "토큰 예금"
  def: "은행 예금을 블록체인 위의 디지털 증표로 바꾼 것. 발행 은행의 예금과 같은 돈이다."
- term: "오버레저"
  def: "서로 다른 블록체인과 은행 시스템을 하나의 연결 방식으로 잇는 퀀트(Quant)의 소프트웨어."
- term: "GBTD"
  def: "영국 은행들이 함께하는 토큰화 파운드 예금 실험(Great British Tokenised Deposits). 퀀트가 플랫폼을 만들었다."
- term: "선물 미결제 약정"
  def: "선물 시장에서 아직 정리되지 않은 계약의 총액. 빌린 돈으로 가격 방향에 거는 자금의 크기를 보여 준다."
- term: "소각"
  def: "발행된 코인을 다시 쓸 수 없는 주소로 보내 없애는 것. 전체 수량이 줄어든다."
- term: "인화인듐"
  def: "광통신용 레이저·수신 칩을 키우는 바탕 웨이퍼(기판)의 소재(InP). AI 데이터센터 광 트랜시버에 쓰인다."
- term: "광 트랜시버"
  def: "데이터센터 서버끼리 빛으로 데이터를 주고받게 하는 부품. 레이저 칩이 들어간다."
- term: "보호예수"
  def: "증자·상장 때 임원·대주주가 일정 기간 주식을 팔지 않기로 하는 약속(락업). 주관사가 예외를 허락할 수 있다."
- term: "수권 주식"
  def: "회사가 정관상 발행할 수 있는 주식 수의 한도. 늘리려면 주주총회 승인이 필요하다."
- term: "공매도 잔고"
  def: "빌려서 판 뒤 아직 갚지 않은 주식 수. 하락에 거는 자금의 크기를 보여 준다."
- term: "라스(RAS) 유전자"
  def: "세포 성장 스위치 역할을 하는 유전자. 변이가 생기면 스위치가 켜진 채 고장 나 암이 자란다. 췌장암에 특히 흔하다."
- term: "범 라스 억제제"
  def: "여러 종류의 라스 변이를 한꺼번에 막도록 설계한 항암제."
- term: "반응률(ORR)"
  def: "종양이 일정 크기 이상 줄어든 환자의 비율."
- term: "미확정 반응(uORR)"
  def: "두 번째 영상 검사로 아직 확인되지 않은 반응까지 넣어 센 반응률."
- term: "부작용 등급"
  def: "임상 시험 부작용의 심한 정도를 1~5등급으로 나눈 것. 5등급은 사망이다."
- term: "패스트트랙"
  def: "심각한 질환 신약의 개발·심사를 빠르게 진행하도록 FDA가 지정하는 제도."
- term: "기술 도입(라이선스 인)"
  def: "다른 회사가 만든 신약 후보의 권리를 돈을 주고 사 오는 것."
- term: "옴니체인 연결망"
  def: "서로 다른 블록체인 사이에서 메시지와 자산을 옮겨 주는 기반 시설. 레이어제로가 대표적이다."
- term: "검증 네트워크(DVN)"
  def: "블록체인 연결망을 지나는 메시지가 맞는지 확인하는 검증자들. 몇 곳의 검증을 거칠지는 쓰는 회사가 정한다."
- term: "수수료 스위치"
  def: "프로토콜 사용료 일부를 토큰 매입·소각이나 보유자 몫으로 돌리도록 켜는 장치. 거버넌스 투표로 정한다."
- term: "물량 해제(언락)"
  def: "초기 투자자·개발자 몫으로 잠겨 있던 코인이 정해진 날짜에 풀리는 것."
- term: "매입·소각"
  def: "코인을 사들여 다시 쓸 수 없게 없애는 것. 유통 물량을 줄인다."
- term: "유통량"
  def: "시장에서 실제로 거래될 수 있는 코인 수. 일정상 해제된 물량과 다를 수 있다."
- term: "AI 에이전트 결제"
  def: "사람 대신 인공지능 프로그램이 스스로 물건·데이터·서비스 값을 내고 받는 결제."
- term: "정산 체인"
  def: "결제가 최종적으로 기록되고 돈이 옮겨지는 블록체인. 결제 서비스는 하나의 체인을 기본 정산 체인으로 정한다."
- term: "베이스(Base)"
  def: "미국 거래소 코인베이스가 만든 블록체인. 이더리움 위에서 돌아가며 스테이블코인 결제에 많이 쓰인다."
- term: "클리프"
  def: "코인 배분 뒤 일정 기간 한 개도 풀리지 않도록 묶어 두는 기간. 클리프가 끝나면 물량이 한꺼번에 또는 나눠서 풀리기 시작한다."
- term: "스팩(SPAC)"
  def: "다른 회사와 합병하는 것만을 목적으로 먼저 상장한 회사. 투자자 돈은 신탁에 넣어 두고, 합병 때 투자자는 주당 약 10달러를 돌려받을지 고를 수 있다."
- term: "상환(스팩)"
  def: "스팩 투자자가 합병에 참여하지 않고 신탁에서 돈을 돌려받는 것. 상환이 많을수록 시장에 남는 주식이 적다."
- term: "중성원자 양자컴퓨터"
  def: "레이저로 원자 하나하나를 붙잡아 큐비트로 쓰는 방식의 양자컴퓨터."
- term: "할인 발행"
  def: "채권을 액면보다 싸게 파는 것. 차이만큼 투자자에게 이익이 된다."
- term: "전환 가격 조정(리셋)"
  def: "정해진 시점 주가가 낮으면 전환사채의 전환 가격을 낮춰 주는 조건. 낮아질수록 같은 채권이 더 많은 주식으로 바뀐다."
- term: "재매도 등록"
  def: "기존 주주나 채권자가 받은 주식을 시장에 팔 수 있도록 증권당국에 등록하는 것."
- term: "네오클라우드"
  def: "아마존·마이크로소프트·구글 같은 대형 클라우드가 아닌, AI용 GPU 대여에 집중하는 신생 클라우드 회사."
- term: "비소구 대출"
  def: "담보 자산과 그 현금 흐름에서만 돈을 갚는 대출. 회사 본체에는 상환 책임이 넘어오지 않는다."
- term: "시장가 매각 프로그램"
  def: "회사가 새 주식을 시장 가격에 조금씩 파는 방식의 증자. 영어 약자로 ATM이라고 부른다."
- term: "설비투자(capex)"
  def: "데이터센터와 GPU처럼 오래 쓰는 자산에 쓰는 돈."
- term: "습성 황반변성"
  def: "망막 아래에 새 혈관이 자라 시력을 잃게 하는 노인성 눈 질환."
- term: "항VEGF 주사"
  def: "새 혈관을 자라게 하는 단백질(VEGF)을 막는 눈 속 주사. 아일리아(애플리버셉트)가 대표적이다."
- term: "비열등성"
  def: "새 약이 기존 약보다 정해진 범위 이상 나쁘지 않음을 보이는 임상시험 방식."
- term: "1차 평가변수"
  def: "임상시험이 성공했는지 판정하는 가장 중요한 기준."
- term: "로열티 계약"
  def: "미래 매출의 일정 비율을 넘기는 대가로 지금 돈을 받는 계약."
- term: "영지식 증명(ZK 롤업)"
  def: "계산이 맞다는 것을 짧은 증명으로 확인하는 기술. ZK 롤업은 이 증명으로 거래 묶음을 이더리움에 기록한다."
- term: "양자 내성"
  def: "미래의 양자컴퓨터로도 깨기 어려운 암호를 쓰는 성질."
- term: "오라클"
  def: "블록체인 밖의 가격 정보를 블록체인 안으로 전해 주는 장치. 오류가 나면 잘못된 청산이 일어난다."
- term: "DAO"
  def: "코인 보유자 투표로 운영을 정하는 탈중앙 조직. 금고와 규칙을 투표로 정한다."
- term: "부실채권(배드뎃)"
  def: "담보 가치가 빌린 돈보다 낮아져 회수할 수 없게 된 대출."
- term: "디파이 대출 프로토콜"
  def: "은행 없이 스마트 계약으로 코인을 맡기고 빌리게 해 주는 서비스."
- term: "무기한 선물"
  def: "만기 없이 계속 들고 갈 수 있는 선물 계약. 빌린 돈으로 가격 방향에 건다."
- term: "탈중앙 거래소"
  def: "회사 서버가 아니라 블록체인 위에서 주문과 정산이 이뤄지는 거래소."
- term: "HIP-3"
  def: "코인 50만 개를 맡긴 누구나 자기 무기한 선물 시장을 열 수 있게 한 하이퍼리퀴드의 규칙. 시장을 연 쪽이 수수료 일부를 가져간다."
- term: "지원 기금(Assistance Fund)"
  def: "하이퍼리퀴드 거래 수수료로 HYPE를 사들여 꺼낼 수 없는 주소에 묶어 두는 장치."
- term: "상장지수펀드(ETF)"
  def: "증권거래소에서 주식처럼 사고파는 펀드. 담고 있는 자산의 값을 따라 움직인다."
- term: "장외 매각(OTC)"
  def: "거래소 주문장을 거치지 않고 정해진 상대에게 한꺼번에 파는 것."
- term: "TIL"
  def: "종양 침윤 림프구. 종양 안으로 파고든 환자 자신의 면역세포. 이를 꺼내 공장에서 키운 뒤 다시 넣는 세포치료에 쓴다."
- term: "확증 임상"
  def: "가속 승인 뒤 생존 같은 최종 결과로 효과를 다시 입증하는 임상. 실패하면 승인이 취소될 수 있다."
- term: "효능 시험법"
  def: "만든 세포치료제가 제대로 작동하는지 재는 실험 방법(potency assay). 세포치료제 승인 심사의 핵심 항목이다."
- term: "시장가 분할 매각"
  def: "회사가 증권사를 통해 시장 가격으로 새 주식을 조금씩 파는 증자 방식(ATM). 한꺼번에 공모하지 않아 할인 폭은 작지만 주식 수가 꾸준히 늘어난다."
- term: "치료 센터"
  def: "특정 세포치료제를 쓸 수 있도록 회사가 인증하고 교육한 병원. 센터 수가 늘어야 치료 환자가 늘어난다."
- term: "가속 승인"
  def: "생존 같은 최종 결과가 나오기 전에 반응률 같은 중간 지표로 먼저 내주는 미국 식품의약국(FDA)의 승인. 확증 임상으로 효과를 다시 입증해야 한다."
- term: "iPSC"
  def: "유도만능줄기세포. 피부나 피 세포를 줄기세포 상태로 되돌린 세포. 원하는 세포로 키울 수 있어 세포치료제 원료로 쓴다."
- term: "기성품 세포치료"
  def: "환자마다 따로 만들지 않고 미리 대량으로 만들어 둔 세포를 여러 환자에게 쓰는 세포치료 방식(off-the-shelf)."
- term: "루푸스신염"
  def: "자가면역 질환인 루푸스가 콩팥을 공격하는 병. 심하면 신부전으로 이어진다."
- term: "RMAT"
  def: "재생의학 첨단치료 지정. 미국 식품의약국이 유망한 재생의학 치료제의 개발과 심사를 돕는 지정."
- term: "등록 가능 임상"
  def: "결과가 좋으면 승인 신청의 근거가 될 수 있도록 설계한 임상."
- term: "사전납입 워런트"
  def: "값을 거의 다 미리 내고 아주 낮은 행사가로 나중에 보통주를 받는 권리. 지분 상한을 맞추려는 대주주가 자주 쓴다."
- term: "CAR-T"
  def: "특정 표적을 찾아가도록 유전자를 바꾼 T세포로 만든 치료제. 혈액암에서 먼저 쓰였고 최근 자가면역 질환으로 넓어지고 있다."
- term: "서브넷"
  def: "비트텐서 안에서 과제별로 따로 돌아가는 작은 네트워크. 참가자가 결과물을 내고 검증자가 점수를 매겨 새 코인을 나눈다."
- term: "알파 토큰"
  def: "비트텐서 서브넷마다 따로 있는 토큰. TAO를 서브넷 풀에 넣으면 받는다. TAO 자체가 아니다."
- term: "효력일"
  def: "미국 펀드 등록 서류가 효력을 갖는 날. 연기 서류를 내면 계속 미룰 수 있다."
- term: "반감기"
  def: "블록마다 새로 발행되는 코인 수가 절반으로 줄어드는 시점. 날짜가 아니라 누적 발행량으로 정해지기도 한다."
- term: "어닐링"
  def: "에너지가 가장 낮은 상태를 찾아가는 성질을 이용해 최적화 문제를 푸는 양자컴퓨터 방식. 디웨이브가 쓴다."
- term: "게이트 모델"
  def: "큐비트에 논리 연산(게이트)을 차례로 걸어 계산하는 범용 양자컴퓨터 방식. 구글·IBM·아이온큐가 쓴다."
- term: "QCaaS"
  def: "양자컴퓨팅 서비스(Quantum Computing as a Service). 양자컴퓨터를 클라우드로 빌려주고 사용료를 받는 사업."
- term: "수주"
  def: "고객과 맺은 계약 금액. 제품을 넘기거나 서비스를 제공해야 매출로 잡힌다."
- term: "전체생존(OS)"
  def: "치료를 시작한 뒤 원인과 관계없이 환자가 살아 있는 기간. 항암 임상에서 가장 엄격한 평가 기준으로 쓰인다."
- term: "사건 기반 분석"
  def: "날짜가 아니라 정해진 수의 사건(사망 등)이 쌓이면 결과를 분석하는 임상 설계. 환자가 오래 살수록 분석 시점이 늦어진다."
- term: "중간 분석"
  def: "임상이 끝나기 전에 미리 정한 시점에 데이터를 들여다보고 계속할지, 멈출지 판단하는 분석."
- term: "독립 데이터 모니터링 위원회(IDMC)"
  def: "회사와 독립된 전문가들이 눈가림을 풀고 임상 데이터를 검토해 안전성과 계속 여부를 권고하는 위원회."
- term: "지배권 변경 조항"
  def: "회사가 인수·합병되는 등 경영권이 바뀔 때 임원에게 퇴직금이나 주식 보상을 주도록 정한 계약 조항."
- term: "BME"
  def: "소각·발행 균형(Burn-and-Mint Equilibrium). 작업 의뢰자가 낸 작업 값만큼 토큰을 태우고, 일한 노드에게는 새로 찍은 토큰을 주는 방식. 태우는 양이 찍는 양보다 많아지면 전체 수량이 줄어든다."
- term: "RNP"
  def: "렌더 네트워크 개선 제안(Render Network Proposal). 커뮤니티 투표로 통과되면 네트워크 규칙이 바뀐다."
- term: "ETP"
  def: "상장지수상품. 코인 같은 자산을 실물로 담아 두고 증권처럼 거래소에서 사고파는 상품. 유럽에서 흔하다."
- term: "교환비율 칼라"
  def: "주식으로 인수 대가를 줄 때 주가가 정한 범위를 벗어나면 교환비율을 위아래로 묶어 두는 장치. 주가가 하한 아래로 내려가면 받는 주식 수가 고정돼 대가의 가치가 줄어든다."
- term: "체인 추상화"
  def: "사용자가 어느 블록체인을 쓰는지 몰라도 원하는 결과만 말하면 여러 체인에 걸친 거래가 처리되게 하는 방식. 니어는 NEAR Intents로 이 방향을 밀고 있다."
- term: "NEAR Intents"
  def: "사용자가 'A체인의 X를 B체인의 Y로'처럼 원하는 결과만 적으면 솔버가 경쟁해 여러 체인에서 처리해 주는 니어의 교환 장치. 거래량이 커져도 니어 체인 위 거래 수가 같이 늘지는 않는다."
- term: "솔버"
  def: "NEAR Intents에서 사용자의 요청을 가장 좋은 조건으로 처리하겠다고 경쟁하는 참여자."
- term: "샤딩"
  def: "블록체인을 여러 조각(샤드)으로 나눠 거래를 나눠 처리하는 방식. 니어는 Nightshade라는 이름으로 단계적으로 넣었다."
- term: "활성 계정"
  def: "하루 동안 거래를 한 번 이상 일으킨 계정 수. 체인을 실제로 쓰는 사람의 규모를 볼 때 쓴다."
- term: "510(k)"
  def: "미국 식품의약국(FDA)이 새 의료기기가 이미 팔리는 기기와 실질적으로 같은지 심사해 판매를 허가하는 절차. 신약 허가와 달리 대규모 임상 대신 기존 기기와의 비교로 판단한다."
- term: "CE 마크"
  def: "유럽연합에서 의료기기를 팔려면 받아야 하는 적합성 인증 표시."
- term: "워런트 유인 행사"
  def: "회사가 기존 워런트를 지금 현금으로 행사하는 대가로, 행사가가 더 높은 새 워런트를 얹어 주는 거래. 당장 돈이 들어오는 대신 주식 수가 늘고 새 워런트가 다시 쌓인다."
- term: "최소 호가 요건"
  def: "나스닥 상장을 유지하려면 종가(최소 호가)가 1달러 이상이어야 한다는 규정. 30거래일 연속 1달러 아래면 통지를 받고, 보통 180일 안에 10거래일 연속 1달러 이상을 회복해야 한다."
- term: "매출총손실"
  def: "매출보다 매출원가가 커서 제품을 팔수록 손해가 나는 상태. 매출총이익이 마이너스라는 뜻이다."

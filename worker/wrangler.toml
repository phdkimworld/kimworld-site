# 김박사 월드 API (조회수·댓글·좋아요·검색어). 배포는 .github/workflows/api.yml 이 한다.
# database_id 는 배포 때 워크플로가 채운다(처음이면 D1을 새로 만든다).
name = "kimworld-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = false
routes = [{ pattern = "api.drkimworld.com", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "kimworld"
database_id = "__D1_ID__"
migrations_dir = "migrations"
